<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roadbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%AD</text></svg>">
<style>
  :root {
    box-sizing: border-box;
    --ink: #20242C;
    --ink-dim: rgba(32,36,44,0.62);
    --ink-faint: rgba(32,36,44,0.4);
    --bg: #F1EADA;
    --panel: #E7DFC9;
    --panel-2: #DCD2B7;
    --panel-edge: rgba(32,36,44,0.14);
    --route: #3E7C6E;
    --route-soft: rgba(62,124,110,0.16);
    --accent: #C67A2B;
    --accent-soft: rgba(198,122,43,0.16);
    --crossing: #5B67A6;
    --crossing-soft: rgba(91,103,166,0.15);
    --danger: #B14B3E;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ECE7D8;
      --ink-dim: rgba(236,231,216,0.64);
      --ink-faint: rgba(236,231,216,0.4);
      --bg: #12161F;
      --panel: #1B212C;
      --panel-2: #242C39;
      --panel-edge: rgba(236,231,216,0.12);
      --route: #5FA79A;
      --route-soft: rgba(95,167,154,0.16);
      --accent: #E3A23E;
      --accent-soft: rgba(227,162,62,0.16);
      --crossing: #8291D6;
      --crossing-soft: rgba(130,145,214,0.16);
      --danger: #D97C6C;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE7D8;
    --ink-dim: rgba(236,231,216,0.64);
    --ink-faint: rgba(236,231,216,0.4);
    --bg: #12161F;
    --panel: #1B212C;
    --panel-2: #242C39;
    --panel-edge: rgba(236,231,216,0.12);
    --route: #5FA79A;
    --route-soft: rgba(95,167,154,0.16);
    --accent: #E3A23E;
    --accent-soft: rgba(227,162,62,0.16);
    --crossing: #8291D6;
    --crossing-soft: rgba(130,145,214,0.16);
    --danger: #D97C6C;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { font-family: var(--font-display); font-weight: 500; margin: 0; }
  input, select, textarea, button { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--accent-soft); }

  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; padding: 22px clamp(16px,4vw,40px) 14px;
    border-bottom: 1px solid var(--panel-edge);
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .topbar .brand { display:flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 28px; letter-spacing: 0.2px; }
  .topbar .tagline { font-size: 13.5px; color: var(--ink-dim); font-style: italic; font-family: var(--font-display); }
  .sync-badge { font-size: 12px; color: var(--ink-dim); display:flex; align-items:center; gap:6px; white-space: nowrap; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background: var(--route); flex: none; }
  .sync-dot.offline { background: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    max-width: 1180px;
    margin: 0 auto;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    #sidebar { border-right: none; border-bottom: 1px solid var(--panel-edge); }
    #tripList { display:flex; overflow-x:auto; gap:10px; padding-bottom: 4px; }
    .trip-card { min-width: 220px; flex: none; }
  }

  #sidebar { padding: 20px 16px; border-right: 1px solid var(--panel-edge); }
  #newTripBtn {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    border: 1px dashed var(--panel-edge); background: transparent;
    color: var(--ink); font-size: 14px; font-weight: 500;
    margin-bottom: 14px; transition: border-color .15s, background .15s;
  }
  #newTripBtn:hover { border-color: var(--route); background: var(--route-soft); }

  .trip-card {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; padding: 12px 13px; margin-bottom: 9px;
    cursor: pointer; position: relative; transition: transform .12s, border-color .12s;
  }
  .trip-card:hover { border-color: var(--route); }
  .trip-card.active { border-color: var(--route); box-shadow: inset 0 0 0 1px var(--route); }
  .trip-card .name { font-family: var(--font-display); font-size: 16px; margin-bottom: 3px; padding-right: 44px; }
  .trip-card .meta { font-size: 12px; color: var(--ink-dim); }
  .trip-card .route-strip { font-size: 11.5px; color: var(--ink-faint); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-card .card-actions { position: absolute; top: 10px; right: 8px; display:flex; gap:2px; }
  .icon-btn {
    background: none; border: none; padding: 4px; border-radius: 5px;
    color: var(--ink-faint); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover { color: var(--ink); background: var(--panel-2); }
  .icon-btn svg { width:14px; height:14px; }

  #main { padding: 22px clamp(16px,4vw,40px) 60px; min-width: 0; }
  #emptyState { padding: 60px 10px; text-align:center; color: var(--ink-dim); }
  #emptyState h2 { font-size: 22px; margin-bottom: 8px; color: var(--ink); }

  .trip-head input.trip-name {
    font-family: var(--font-display); font-size: 32px; font-weight: 500;
    background: none; border: none; width: 100%; padding: 2px 0; margin-bottom: 10px;
    border-bottom: 1px solid transparent;
  }
  .trip-head input.trip-name:focus { outline: none; border-bottom: 1px solid var(--route); }
  .trip-meta-row { display:flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 18px; font-size: 13.5px; color: var(--ink-dim); }
  .trip-meta-row label { display:flex; align-items:center; gap: 6px; }
  .trip-meta-row input[type=date], .trip-meta-row select, .trip-meta-row input[type=number] {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 5px 8px; font-size: 13px; color: var(--ink);
  }

  .chip-row { display:flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    font-size: 12.5px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--panel-edge); background: var(--panel);
    color: var(--ink-dim); user-select: none;
  }
  .chip.on { border-color: var(--route); background: var(--route-soft); color: var(--ink); }
  .chip.country { display:flex; align-items:center; gap:6px; }
  .chip.country .rm { color: var(--ink-faint); }
  .chip.country .rm:hover { color: var(--danger); }
  .chip.currency .rm { color: var(--ink-faint); cursor: pointer; }
  .chip.currency .rm:hover { color: var(--danger); }
  .add-country { display:flex; align-items:center; gap:6px; margin-top: 2px; }
  .add-country input {
    background: none; border: none; border-bottom: 1px dashed var(--panel-edge);
    font-size: 12.5px; padding: 4px 2px; width: 130px; color: var(--ink);
  }
  .add-country input:focus { outline:none; border-bottom-color: var(--route); }

  section.block { margin-top: 34px; }
  .block-head { display:flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .block-head h3 { font-size: 20px; }
  .block-head .hint { font-size: 12px; color: var(--ink-faint); }

  .roadbook { position: relative; padding-left: 30px; }
  .roadbook::before {
    content: ""; position:absolute; left: 9px; top: 8px; bottom: 8px; width: 2px;
    background: repeating-linear-gradient(to bottom, var(--panel-edge) 0 6px, transparent 6px 11px);
  }
  .leg {
    position: relative; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; padding: 14px 14px 12px; margin-bottom: 12px;
  }
  .leg::before {
    content: ""; position: absolute; left: -25px; top: 18px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--route);
  }
  .leg[data-mode="ferry"]::before, .leg[data-mode="tunnel"]::before { border-color: var(--crossing); }
  .leg-row1 { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .leg-row1 input.city {
    font-family: var(--font-display); font-size: 16px; background:none; border:none;
    border-bottom: 1px solid transparent; padding: 2px 1px; min-width: 90px; flex: 1;
  }
  .leg-row1 input.city:focus { outline:none; border-bottom-color: var(--route); }
  .leg-arrow { color: var(--ink-faint); }
  .mode-select {
    display:flex; align-items:center; gap:6px; background: var(--panel-2);
    border: 1px solid var(--panel-edge); border-radius: 7px; padding: 4px 8px;
  }
  .mode-select svg { width:15px; height:15px; color: var(--route); }
  .leg[data-mode="ferry"] .mode-select svg, .leg[data-mode="tunnel"] .mode-select svg { color: var(--crossing); }
  .mode-select select { background:none; border:none; font-size: 12.5px; }
  .leg-row2 { display:flex; flex-wrap: wrap; gap: 14px; align-items:center; font-size: 12.5px; color: var(--ink-dim); }
  .leg-row2 .field { display:flex; align-items:center; gap:5px; }
  .leg-row2 input[type=number] {
    width: 66px; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 4px 6px; font-size: 12.5px;
  }
  .leg-row2 input.notes {
    flex: 1; min-width: 140px; background:none; border:none; border-bottom: 1px dashed transparent;
    font-size: 12.5px; padding: 4px 2px;
  }
  .leg-row2 input.notes:focus { outline:none; border-bottom-color: var(--panel-edge); }
  .leg-controls { display:flex; gap:2px; margin-left:auto; }

  .auto-chip {
    font-size: 11px; line-height: 1.5; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--panel-edge); background: none; color: var(--ink-faint);
  }
  .auto-chip.on { background: var(--route-soft); border-color: var(--route); color: var(--ink); cursor: help; }
  .auto-chip.off:hover { border-color: var(--route); color: var(--ink); }
  .ghost-btn {
    background: none; border: 1px dashed var(--panel-edge); border-radius: 8px;
    padding: 9px 14px; font-size: 13px; color: var(--ink-dim); margin-left: 30px;
  }
  .ghost-btn:hover { border-color: var(--route); color: var(--ink); }

  .day-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom: 8px; margin-bottom: 14px; }
  .day-tab {
    flex: none; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 8px; padding: 7px 13px; font-size: 12.5px; white-space: nowrap;
  }
  .day-tab.active { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .day-panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 16px; }
  .day-panel .day-date { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  .day-panel label { display:block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
  .day-panel input.overnight {
    width: 100%; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 7px 9px; font-size: 13.5px; margin-bottom: 12px;
  }
  .day-panel textarea.plan {
    width: 100%; min-height: 76px; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 9px; font-size: 13px; resize: vertical; line-height: 1.5;
  }

  .day-overview { display:grid; gap: 6px; margin-bottom: 16px; }
  .day-row {
    display:grid; grid-template-columns: 150px 1fr; gap: 4px 12px; align-items: baseline; text-align: left;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px 12px; width: 100%;
  }
  .day-row:hover { border-color: var(--accent); }
  .day-row.active { border-color: var(--accent); background: var(--accent-soft); }
  .day-row .when { font-size: 12.5px; color: var(--ink-dim); }
  .day-row .where { font-size: 14px; display:flex; flex-wrap:wrap; gap: 2px 7px; align-items: baseline; }
  .day-row .where .arr { color: var(--ink-faint); font-size: 12px; }
  .day-row .where .dim { color: var(--ink-faint); font-size: 12.5px; }
  .day-row .near { grid-column: 2; font-size: 11.5px; color: var(--ink-faint); }
  @media (max-width: 560px) { .day-row { grid-template-columns: 1fr; } .day-row .near { grid-column: 1; } }
  .est-note { font-size: 11.5px; color: var(--ink-faint); margin: 0 0 10px; line-height: 1.5; }
  .day-est { font-size: 13px; color: var(--ink-dim); margin-bottom: 12px; line-height: 1.6; }
  .day-est b { color: var(--ink); font-weight: 500; }
  .linklike { background: none; border: none; padding: 0; margin-left: 6px; font-size: 12px; color: var(--route); text-decoration: underline; }
  .it-settings { display:flex; flex-wrap:wrap; gap: 10px 22px; align-items:center; margin-bottom: 14px; font-size: 12.5px; color: var(--ink-dim); }
  .it-settings label { display:flex; align-items:center; gap:6px; }
  .it-settings input { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; }
  .it-settings input[type=number] { width: 54px; }
  .it-day { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .it-head { display:flex; flex-wrap:wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 10px; }
  .it-head .it-dayname { font-family: var(--font-display); font-size: 17px; }
  .it-head .it-where { font-size: 13px; color: var(--ink-dim); }
  .it-head .it-start { margin-left: auto; font-size: 12px; color: var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .it-head input[type=time], .it-add input, .field input[type=time] { background: var(--panel-2); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 3px 6px; font-size: 12.5px; }
  .it-list { list-style: none; margin: 0; padding: 0; }
  .it-item { display:grid; grid-template-columns: 74px 1fr auto; gap: 2px 12px; padding: 7px 0; border-top: 1px dashed var(--panel-edge); }
  .it-item:first-child { border-top: none; }
  .it-time { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
  .it-title { font-size: 14px; }
  .it-sub { font-size: 12px; color: var(--ink-dim); margin-top: 1px; line-height: 1.45; }
  .it-item.sail .it-time, .it-item.checkin .it-time { color: var(--crossing); }
  .it-item.end .it-time, .it-item.end .it-title { color: var(--accent); }
  .it-item.custom .it-title { font-style: italic; }
  .it-item.rest .it-title { color: var(--ink-dim); }
  .it-warn { margin: 8px 0 0; font-size: 12px; color: var(--danger); line-height: 1.45; }
  .it-add { display:flex; flex-wrap:wrap; gap: 8px; margin-top: 10px; align-items:center; }
  .it-add input.newTitle { flex: 1; min-width: 160px; }
  .it-add button { background: none; border: 1px dashed var(--panel-edge); border-radius: 8px; padding: 4px 12px; font-size: 12.5px; color: var(--ink-dim); }
  .it-add button:hover { border-color: var(--route); color: var(--ink); }
  .print-only { display: none; }
  @media print {
    body.print-itin { --ink:#20242C; --ink-dim:rgba(32,36,44,.7); --ink-faint:rgba(32,36,44,.5); --bg:#fff; --panel:#fff; --panel-2:#f4f1ea; --panel-edge:rgba(32,36,44,.25); --accent:#9a5a14; --crossing:#3f4a86; --danger:#a03a2e; background:#fff; color:#20242C; }
    body.print-itin .topbar, body.print-itin #sidebar, body.print-itin footer.foot, body.print-itin .trip-head,
    body.print-itin section.block:not(#itinerarySection), body.print-itin .no-print, body.print-itin .it-add, body.print-itin .it-settings, body.print-itin .it-rm { display: none !important; }
    body.print-itin .layout { display: block; max-width: none; }
    body.print-itin #main { padding: 0; }
    body.print-itin .print-only { display: block; }
    body.print-itin .it-day { break-inside: avoid; border-color: #bbb; }
    body.print-itin .it-head input[type=time] { border: none; background: none; padding: 0; appearance: none; -webkit-appearance: none; }
  }
  .budget-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 16px; }
  @media (max-width: 520px) { .budget-grid { grid-template-columns: 1fr; } }
  .budget-row { display:flex; align-items:center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 9px 12px; }
  .budget-row label { font-size: 13px; color: var(--ink-dim); }
  .budget-row .amt { display:flex; align-items:center; gap:4px; }
  .budget-row input[type=number] {
    width: 84px; text-align:right; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 5px 7px; font-size: 13px;
  }
  .totals-bar { display:flex; flex-wrap:wrap; gap: 22px; align-items: flex-end; margin-top: 8px;
    border-top: 1px solid var(--panel-edge); padding-top: 16px; }
  .totals-bar .tstat { }
  .totals-bar .tstat .label { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 2px; }
  .totals-bar .tstat .val { font-family: var(--font-display); font-size: 26px; }
  .totals-bar .tstat.grand .val { font-size: 38px; color: var(--accent); }
  .split-input { display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--ink-dim); margin-left:auto; }
  .split-input input { width: 44px; background: var(--panel-2); border: 1px solid var(--panel-edge); border-radius:6px; padding: 4px 6px; }

  footer.foot { max-width: 1180px; margin: 20px auto 40px; padding: 0 clamp(16px,4vw,40px);
    font-size: 11.5px; color: var(--ink-faint); }

  #mapHost { height: 420px; border-radius: 10px; overflow: hidden; border: 1px solid var(--panel-edge); background: var(--panel); }
  #mapHost.empty { display: none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
  .leaflet-container { font-family: var(--font-body); }
  #mapStatus { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
  .map-legend { background: var(--panel); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; line-height: 1.7; box-shadow: 0 1px 6px rgba(0,0,0,0.18); }
  .map-legend .sw { display:inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 7px; border-radius: 2px; }
  .leg-arrow-icon { background: none; border: none; }
  .leg-arrow-icon svg { display:block; overflow: visible; filter: drop-shadow(0 0 1.5px rgba(0,0,0,0.55)); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>Roadbook</h1>
      <span class="tagline">plan the crossing</span>
    </div>
    <div class="sync-badge"><span class="sync-dot offline" id="syncDot"></span><span id="syncText">Checking sync…</span></div>
  </div>

  <div class="layout">
    <aside id="sidebar">
      <button id="newTripBtn">+ New trip</button>
      <div id="tripList"></div>
    </aside>
    <main id="main">
      <div id="emptyState">
        <h2>No trip open</h2>
        <p>Pick one on the left, or start a new one.</p>
      </div>
      <div id="tripPanel" style="display:none;"></div>
    </main>
  </div>

  <footer class="foot" id="footNote"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  // ---------- mode icons ----------
  const ICONS = {
    drive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><line x1="12" y1="3.8" x2="12" y2="7.2"/><line x1="12" y1="16.8" x2="12" y2="20.2"/><line x1="3.8" y1="12" x2="7.2" y2="12"/><line x1="16.8" y1="12" x2="20.2" y2="12"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
    ferry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 15h16l-2 4.5H6L4 15Z"/><path d="M8 15V7h5l3 5"/><line x1="9.5" y1="7" x2="9.5" y2="4"/></svg>',
    tunnel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V11a8 8 0 0 1 16 0v8"/><line x1="4" y1="19" x2="4" y2="21.5"/><line x1="20" y1="19" x2="20" y2="21.5"/></svg>',
    train: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5.5" y="4" width="13" height="13" rx="3"/><line x1="5.5" y1="11" x2="18.5" y2="11"/><circle cx="9" cy="17.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="17.5" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="20.3" x2="6" y2="22"/><line x1="16" y1="20.3" x2="18" y2="22"/></svg>',
    flight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 13.5 20 7l-6.5 7L15 21l-3.2-5.3L3 13.5Z"/></svg>'
  };
  const MODES = [
    {id:'drive', label:'Drive'},
    {id:'ferry', label:'Ferry'},
    {id:'tunnel', label:'Eurotunnel'},
    {id:'train', label:'Train'},
    {id:'flight', label:'Flight'}
  ];
  const CURRENCY_SYM = { GBP:'£', EUR:'€', USD:'$', CHF:'CHF', SEK:'kr', NOK:'kr', DKK:'kr', PLN:'zł', CZK:'Kč', HUF:'Ft' };
  const PREFS = ['Scenic route','Fastest route','Avoid tolls','Family-friendly','Comfort stops','Budget-conscious'];
  const COUNTRY_CURRENCY = {
    'united kingdom':'GBP', 'ireland':'EUR', 'france':'EUR', 'belgium':'EUR', 'luxembourg':'EUR',
    'netherlands':'EUR', 'germany':'EUR', 'spain':'EUR', 'italy':'EUR', 'portugal':'EUR', 'austria':'EUR',
    'finland':'EUR', 'greece':'EUR', 'slovakia':'EUR', 'slovenia':'EUR', 'estonia':'EUR', 'latvia':'EUR',
    'lithuania':'EUR', 'malta':'EUR', 'cyprus':'EUR', 'croatia':'EUR',
    'switzerland':'CHF', 'norway':'NOK', 'sweden':'SEK', 'denmark':'DKK', 'poland':'PLN',
    'czechia':'CZK', 'czech republic':'CZK', 'hungary':'HUF'
  };
  function currencyForCountry(countryName){
    return COUNTRY_CURRENCY[(countryName||'').trim().toLowerCase()] || null;
  }
  function extractCountry(label){
    const parts = (label||'').split(',');
    return parts.length ? parts[parts.length-1].trim() : '';
  }

  // ---------- automatic leg costs ----------
  // Fuel is worked out from distance x efficiency x pump price. Ferry / tunnel fares can't be fetched live
  // (no free, keyless API exists for them), so they're estimated from typical published fares, adjusted for
  // the time of year. Always an estimate: the "Check current prices" link on each leg is the real number.
  const AUTO_MODES = ['drive','ferry','tunnel'];

  const PORTS = {
    dover:['dover'], calais:['calais','coquelles'], dunkirk:['dunkirk','dunkerque'], folkestone:['folkestone'],
    newhaven:['newhaven'], dieppe:['dieppe'], portsmouth:['portsmouth'], caen:['caen','ouistreham'],
    cherbourg:['cherbourg'], lehavre:['le havre','havre'], stmalo:['st malo','saint-malo','saint malo','st-malo'],
    poole:['poole'], plymouth:['plymouth'], roscoff:['roscoff'], santander:['santander'], bilbao:['bilbao']
  };
  // One-way, standard car + up to 2 adults, off-peak, GBP. Rounded from operator "from" prices (2026).
  const ROUTES = [
    { a:'dover', b:'calais', gbp:90, label:'Dover–Calais ferry' },
    { a:'dover', b:'dunkirk', gbp:90, label:'Dover–Dunkirk ferry' },
    { a:'newhaven', b:'dieppe', gbp:120, label:'Newhaven–Dieppe ferry' },
    { a:'portsmouth', b:'caen', gbp:130, label:'Portsmouth–Caen ferry' },
    { a:'portsmouth', b:'cherbourg', gbp:140, label:'Portsmouth–Cherbourg ferry' },
    { a:'portsmouth', b:'lehavre', gbp:120, label:'Portsmouth–Le Havre ferry' },
    { a:'portsmouth', b:'stmalo', gbp:195, label:'Portsmouth–St Malo ferry' },
    { a:'poole', b:'cherbourg', gbp:120, label:'Poole–Cherbourg ferry' },
    { a:'plymouth', b:'roscoff', gbp:130, label:'Plymouth–Roscoff ferry' },
    { a:'portsmouth', b:'santander', gbp:290, label:'Portsmouth–Santander ferry (cabin extra)', via:[[48.6,-5.6]] },
    { a:'portsmouth', b:'bilbao', gbp:290, label:'Portsmouth–Bilbao ferry (cabin extra)', via:[[48.6,-5.6]] },
    { a:'plymouth', b:'santander', gbp:290, label:'Plymouth–Santander ferry (cabin extra)', via:[[48.6,-5.6]] }
  ];
  const TUNNEL_GBP = 125; // LeShuttle "Standard" one-way, per car, up to 9 people

  function portId(name){
    const key = (name||'').split(',')[0].toLowerCase()
      .replace(/\b(ferry|terminal|port|docks?|harbou?r|city|international)\b/g, ' ').replace(/\s+/g, ' ').trim();
    if (!key) return '';
    for (const id of Object.keys(PORTS)){
      if (PORTS[id].some(al => key === al || key.includes(al))) return id;
    }
    return '';
  }
  function seasonFor(dateStr){
    if (!dateStr || dateStr.length < 10) return { factor: 1, label: '' };
    const md = parseInt(dateStr.slice(5,7),10) * 100 + parseInt(dateStr.slice(8,10),10);
    if (md >= 1220 || md <= 103) return { factor: 1.4, label: 'Christmas / New Year' };
    if (md >= 718 && md <= 831) return { factor: 1.5, label: 'summer holidays' };
    if (md >= 1022 && md <= 1102) return { factor: 1.15, label: 'October half-term' };
    if (md >= 524 && md <= 602) return { factor: 1.15, label: 'May half-term' };
    if (md >= 1101 && md <= 1215) return { factor: 0.85, label: 'quiet season' };
    if (md >= 104 && md <= 315) return { factor: 0.9, label: 'quiet season' };
    return { factor: 1, label: '' };
  }
  function money(v, cur){ return (CURRENCY_SYM[cur] || (cur + ' ')) + v.toFixed(2); }
  // Convert a GBP amount into another trip currency using the trip's own exchange rates (rates[c] = 1 c in home).
  function gbpTo(amountGbp, cur, d){
    if (cur === 'GBP') return amountGbp;
    const home = d.currencies[0];
    let gbpInHome = null;
    if (home === 'GBP') gbpInHome = 1; else if (d.rates && d.rates.GBP > 0) gbpInHome = d.rates.GBP;
    if (gbpInHome == null) return null;
    const inHome = amountGbp * gbpInHome;
    if (cur === home) return inHome;
    const r = d.rates && d.rates[cur];
    return r > 0 ? inHome / r : null;
  }

  function fuelEstimate(leg, d){
    const cur = leg.costCurrency || d.currencies[0];
    const l100 = litersPer100(d.fuel.efficiency, d.fuel.efficiencyUnit);
    const km = parseFloat(leg.distanceKm) || 0;
    const litres = km / 100 * l100;
    const price = (d.fuel.prices && d.fuel.prices[cur]) || 0;
    const note = price > 0
      ? `Fuel: ${km} km at ${l100.toFixed(1)} L/100km = ${litres.toFixed(0)} L, at ${money(price, cur)} per litre.`
      : `Set a fuel price for ${cur} in the fuel calculator to estimate this leg.`;
    return { amount: litres * price, note };
  }
  function crossingEstimate(leg, d, dateStr){
    if (!(leg.from||'').trim() || !(leg.to||'').trim()) return null;
    const a = portId(leg.from), b = portId(leg.to);
    const route = ROUTES.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a));
    let baseGbp, label, generic = false;
    if (leg.mode === 'tunnel'){ baseGbp = TUNNEL_GBP; label = 'Eurotunnel (LeShuttle), one way per car'; }
    else if (route){ baseGbp = route.gbp; label = route.label; }
    else {
      const km = parseFloat(leg.distanceKm) || 0;
      baseGbp = km > 0 ? Math.round(45 + 0.6 * km) : 90;
      label = 'Ferry (route not recognised)'; generic = true;
    }
    const season = seasonFor(dateStr);
    const gbp = baseGbp * season.factor;
    const cur = leg.costCurrency || d.currencies[0];
    let amount = gbpTo(gbp, cur, d), conv = '';
    if (amount == null){ amount = gbp; conv = ` No GBP exchange rate is set, so this is shown as £${gbp.toFixed(0)} unconverted.`; }
    const note = `${label}: typically about £${baseGbp} for a car and passengers off-peak` +
      (season.label ? `, x${season.factor} for ${season.label}` : '') +
      (generic ? '. Rough guess from the distance' : '') +
      `. This is an estimate, not a live price; use "Check current prices" for the real fare.` + conv;
    return { amount, note };
  }
  function autoCostFor(leg, d, dateStr){
    if (leg.mode === 'drive') return fuelEstimate(leg, d);
    if (leg.mode === 'ferry' || leg.mode === 'tunnel') return crossingEstimate(leg, d, dateStr);
    return null;
  }
  function applyAutoCosts(d, plan){
    plan = plan || computeDayPlan(d);
    let changed = false;
    (d.legs||[]).forEach((leg, i) => {
      if (leg.costAuto === false || !AUTO_MODES.includes(leg.mode)) return;
      const est = autoCostFor(leg, d, plan.legDates[i]);
      const v = est ? Math.round(est.amount) : 0;
      if (leg.cost !== v){ leg.cost = v; changed = true; }
    });
    return changed;
  }
  // Ferries and the tunnel are sold in the home currency (UK operators sell in GBP); other legs follow the
  // country you end up in, once that place has been looked up.
  function autoCurrencyForLeg(leg, d){
    if (leg.mode === 'ferry' || leg.mode === 'tunnel') return d.currencies[0];
    const g = geoFor(d, leg.to);
    if (!g) return null;
    const cur = currencyForCountry(extractCountry(g.label));
    return (cur && d.currencies.includes(cur)) ? cur : null;
  }
  function applyAutoCurrencies(d){
    let changed = false;
    (d.legs||[]).forEach(leg => {
      if (leg.costCurrencyAuto === false) return;
      const c = autoCurrencyForLeg(leg, d);
      if (c && leg.costCurrency !== c){ leg.costCurrency = c; changed = true; }
    });
    return changed;
  }

  // ---------- day-by-day estimate ----------
  function geoFor(d, name){
    const key = (name||'').trim().toLowerCase();
    if (!key) return null;
    return (d && d.geoV2 && d.geoV2[key]) || geoCache[key] || null;
  }
  function countryFromLabel(label){
    const i = (label||'').lastIndexOf(',');
    return i < 0 ? '' : label.slice(i+1).trim();
  }
  // "United Kingdom" -> "England" when the trip's own country list says England
  function displayCountry(name, d){
    if (!name) return '';
    const own = (d.countries||[]).find(c => countryMatches(c, name));
    return own || name;
  }
  function shortName(n){ return (n||'').split(',')[0].trim(); }
  function legWeight(l){
    const h = parseFloat(l.hours) || 0;
    if (h > 0) return h;
    const km = parseFloat(l.distanceKm) || 0;
    return km > 0 ? km / 80 : 1;
  }

  // Lays the legs out along a timeline of travel-hours, decides how far along that timeline each day ends
  // (evenly spread over the dates, but pinned to any "Overnight in" the person has set), then reads off
  // which countries the route passes through in each day's slice. Countries are taken from each leg's
  // start and end points, with the border assumed halfway through the leg, so a country you only pass
  // through (e.g. Belgium on the way from Luxembourg to Amsterdam) won't show up.
  function computeDayPlan(d){
    const legs = d.legs || [], days = d.days || [], N = days.length;
    const H = [0];
    legs.forEach(l => H.push(H[H.length-1] + legWeight(l)));
    const T = H[H.length-1];
    const rawNames = legs.length ? [(legs[0].from||'').trim()].concat(legs.map(l => (l.to||'').trim())) : [];
    const lowNames = rawNames.map(n => n.toLowerCase());
    const plan = { days: [], legDates: [], total: T, leftover: 0, missingGeo: 0 };
    plan.missingGeo = new Set(lowNames.filter(n => n && !geoFor(d, n))).size;

    // 1. where each day ends, in travel-hours
    const E = new Array(N).fill(0);
    if (N && legs.length){
      const anchors = [];
      let prevK = 0;
      days.forEach((day, i) => {
        const o = (day.overnight||'').trim().toLowerCase();
        if (!o) return;
        const nominal = T * (i+1) / N;
        let bestK = -1, bestD = Infinity;
        for (let k = prevK; k < lowNames.length; k++){
          const nm = lowNames[k];
          if (!nm || !(nm === o || nm.includes(o) || o.includes(nm))) continue;
          const dd = Math.abs(H[k] - nominal);
          if (dd < bestD){ bestD = dd; bestK = k; }
        }
        if (bestK >= 0){ anchors.push({ i, t: H[bestK] }); prevK = bestK; }
      });
      const pts = [{ i: -1, t: 0 }].concat(anchors);
      if (!anchors.length || anchors[anchors.length-1].i < N-1) pts.push({ i: N-1, t: T });
      for (let p = 0; p < pts.length-1; p++){
        const a = pts[p], b = pts[p+1];
        for (let i = a.i+1; i <= b.i; i++) E[i] = a.t + (b.t - a.t) * (i - a.i) / (b.i - a.i);
      }
      plan.leftover = Math.max(0, T - E[N-1]);
    }

    // 2. country "atoms" along the timeline
    const countryOf = name => { const g = geoFor(d, name); return g ? displayCountry(countryFromLabel(g.label), d) : ''; };
    const atoms = [];
    legs.forEach((l, j) => {
      const a = H[j], b = H[j+1];
      const cf = countryOf(l.from), ct = countryOf(l.to);
      if (cf && ct && cf !== ct){ const m = (a + b) / 2; atoms.push({ a, b: m, c: cf }, { a: m, b, c: ct }); }
      else atoms.push({ a, b, c: cf || ct });
    });
    const countryAt = t => {
      for (const at of atoms) if (at.c && at.a <= t + 1e-9 && t < at.b - 1e-9) return at.c;
      for (let i = atoms.length - 1; i >= 0; i--) if (atoms[i].c && t >= atoms[i].b - 1e-9) return atoms[i].c;
      return '';
    };
    const describeEnd = t => {
      let bk = -1, bd = Infinity;
      rawNames.forEach((n, k) => { if (!n) return; const dd = Math.abs(H[k] - t); if (dd < bd){ bd = dd; bk = k; } });
      if (bk < 0) return { stop: '', near: '', suggest: '' };
      const name = rawNames[bk];
      if (bd <= 1.5) return { stop: name, near: (bd < 0.05 ? 'Ends at ' : 'Ends near ') + shortName(name), suggest: name };
      let j = 0; while (j < legs.length - 1 && H[j+1] < t) j++;
      return { stop: name, near: `Ends between ${shortName(rawNames[j])} and ${shortName(rawNames[j+1])}`, suggest: '' };
    };

    // 3. read off each day
    days.forEach((day, i) => {
      const ws = i === 0 ? 0 : E[i-1], we = E[i];
      const list = [];
      const add = c => { if (c && !list.includes(c)) list.push(c); };
      if (legs.length){
        if (we - ws > 1e-6) atoms.forEach(at => { if (Math.min(at.b, we) - Math.max(at.a, ws) > 1e-6) add(at.c); });
        else add(countryAt(ws));
      }
      const og = geoFor(d, day.overnight);
      if (og) add(displayCountry(countryFromLabel(og.label), d));
      const end = legs.length ? describeEnd(we) : { stop: '', near: '', suggest: '' };
      plan.days.push({ countries: list, hours: we - ws, near: end.near, stop: end.stop, suggest: end.suggest });
    });

    // 4. which day each leg falls on (for season-dependent fares)
    legs.forEach((l, j) => {
      const tm = (H[j] + H[j+1]) / 2;
      let di = -1;
      for (let i = 0; i < N; i++){ if (tm <= E[i] + 1e-9){ di = i; break; } }
      if (di < 0 && N) di = N - 1;
      plan.legDates.push(di >= 0 ? days[di].date : (d.startDate || ''));
    });
    plan.E = E; plan.H = H;
    return plan;
  }

  // ---------- timings & itinerary ----------
  const DEFAULT_TIMING = { start: '08:00', breakEveryH: 2, breakMin: 20, ferryCheckinMin: 60, tunnelCheckinMin: 45 };
  // Winter UTC offsets, only used to work out how the clock changes when you cross between zones
  const TZ_OFFSET = { 'united kingdom':0, ireland:0, portugal:0, iceland:0, finland:2, greece:2, estonia:2, latvia:2,
    lithuania:2, romania:2, bulgaria:2, cyprus:2, ukraine:2, turkey:3 };
  function tzOffset(countryRaw){
    const k = (countryRaw||'').trim().toLowerCase();
    if (!k) return null;
    return (k in TZ_OFFSET) ? TZ_OFFSET[k] : 1;
  }
  function parseHM(v){
    const m = /^(\d{1,2}):(\d{2})$/.exec(v || '');
    return m ? parseInt(m[1],10) * 60 + parseInt(m[2],10) : null;
  }
  function fmtHM(min){
    let next = false;
    min = Math.round(min);
    if (min >= 1440){ min -= 1440; next = true; }
    if (min < 0) min += 1440;
    const t = String(Math.floor(min/60)).padStart(2,'0') + ':' + String(min%60).padStart(2,'0');
    return next ? t + ' +1d' : t;
  }
  function fmtDur(min){
    min = Math.round(min);
    const h = Math.floor(min/60), m = min % 60;
    if (!h) return m + ' min';
    return m ? `${h} h ${m} min` : `${h} h`;
  }

  // Turns each day's slice of the route into a timed list: leave, drive (with breaks), ferry check-in, sailing,
  // arrive, plus anything the person added by hand. Sailing times are the person's own if entered, otherwise
  // the earliest one after check-in, so treat those as estimates.
  function computeItinerary(d, plan){
    plan = plan || computeDayPlan(d);
    const T = Object.assign({}, DEFAULT_TIMING, d.timing || {});
    const legs = d.legs || [], days = d.days || [];
    const countryRawOf = name => { const g = geoFor(d, name); return g ? countryFromLabel(g.label) : ''; };
    const out = [];
    days.forEach((day, i) => {
      const ws = i === 0 ? 0 : plan.E[i-1], we = plan.E[i];
      let clock = parseHM(day.start);
      if (clock == null) clock = parseHM(T.start);
      if (clock == null) clock = 480;
      const startMin = clock;
      const items = [], warns = [];
      let driven = 0, driveH = 0, driveKm = 0;

      legs.forEach((leg, j) => {
        const a = Math.max(plan.H[j], ws), b = Math.min(plan.H[j+1], we);
        if (b - a <= 1e-6) return;
        const span = plan.H[j+1] - plan.H[j] || 1;
        const hrs = b - a, frac = hrs / span;
        const startsMid = a > plan.H[j] + 1e-6, endsMid = b < plan.H[j+1] - 1e-6;
        const from = shortName(leg.from) || 'start', to = shortName(leg.to) || 'destination';
        const km = Math.round((parseFloat(leg.distanceKm)||0) * frac);
        const tzShift = (() => {
          const o1 = tzOffset(countryRawOf(leg.from)), o2 = tzOffset(countryRawOf(leg.to));
          return (o1 == null || o2 == null) ? 0 : o2 - o1;
        })();

        if (leg.mode === 'ferry' || leg.mode === 'tunnel'){
          const isT = leg.mode === 'tunnel';
          const checkin = parseFloat(isT ? T.tunnelCheckinMin : T.ferryCheckinMin) || 0;
          const earliest = clock + checkin;
          let dep = earliest;
          const fixed = parseHM(leg.departTime);
          if (fixed != null){
            dep = fixed;
            if (fixed < earliest) warns.push(`You'd reach ${from} at ${fmtHM(clock)}, only ${Math.max(0, fixed - clock)} min before the ${fmtHM(fixed)} ${isT ? 'train' : 'sailing'}. Check-in needs about ${checkin} min.`);
          }
          const ciAt = Math.max(clock, dep - checkin);
          items.push({ t: ciAt, kind: 'checkin', title: `Check in at ${from}`,
            sub: (dep - ciAt > checkin + 10 ? `${fmtDur(dep - ciAt - checkin)} spare before check-in. ` : '') + `Be there ${checkin} min before departure` });
          const dur = hrs * 60;
          const arr = dep + dur + tzShift * 60;
          const price = (parseFloat(leg.cost) || 0) > 0 ? ` · about ${CURRENCY_SYM[leg.costCurrency] || (leg.costCurrency + ' ')}${Math.round(leg.cost)}` : '';
          items.push({ t: dep, kind: 'sail', title: `${isT ? 'Eurotunnel' : 'Ferry'} ${from} → ${to}`,
            sub: `${fixed != null ? 'Departs' : 'Earliest departure'} ${fmtHM(dep)} · ${fmtDur(dur)} crossing${price} · arrive ${fmtHM(arr)} local time` +
              (tzShift ? ` (clocks ${tzShift > 0 ? 'forward' : 'back'} ${Math.abs(tzShift)} h)` : '') });
          clock = arr; driven = 0;
        } else {
          const isRoad = leg.mode === 'drive';
          const every = parseFloat(T.breakEveryH) || 0;
          let breaks = 0;
          if (isRoad && every > 0 && (parseFloat(T.breakMin) || 0) > 0){
            breaks = Math.max(0, Math.floor((driven + hrs - 1e-6) / every));
            driven = driven + hrs - breaks * every;
          }
          const brk = breaks * (parseFloat(T.breakMin) || 0);
          const dur = hrs * 60 + brk;
          const modeLabel = { drive:'Drive', train:'Train', flight:'Flight' }[leg.mode] || 'Travel';
          const arr = clock + dur + (endsMid ? 0 : tzShift * 60);
          items.push({ t: clock, kind: leg.mode, title: startsMid ? `Continue to ${to}` : `${modeLabel} ${from} → ${to}`,
            sub: `${km ? km + ' km · ' : ''}${fmtDur(hrs * 60)}${breaks ? ` + ${breaks} × ${T.breakMin} min break${breaks > 1 ? 's' : ''}` : ''} · ${endsMid ? 'stop for the night around' : 'arrive'} ${fmtHM(arr)}` +
              (endsMid ? '' : (tzShift ? ` local time (clocks ${tzShift > 0 ? 'forward' : 'back'} ${Math.abs(tzShift)} h)` : '')) });
          clock = arr;
          if (isRoad){ driveH += hrs; driveKm += km; }
        }
      });

      const p = plan.days[i] || {};
      if (items.length){
        const where = (day.overnight || '').trim() || (p.near ? p.near.replace(/^Ends (at|near|between) /, '') : '');
        items.push({ t: clock, kind: 'end', title: where ? `Overnight: ${where}` : 'End of day', sub: `Arrive around ${fmtHM(clock)}` });
        if (clock > 22 * 60) warns.push(`This day finishes around ${fmtHM(clock)}. Consider an earlier start or moving some driving to another day.`);
      } else if (legs.length) {
        const where = (day.overnight || '').trim() || (p.near ? p.near.replace(/^Ends (at|near|between) /, '') : '');
        items.push({ t: startMin, kind: 'rest', title: `Rest day${where ? ' in ' + where : ''}`, sub: 'No travel planned' });
      }
      (day.items || []).forEach(it => {
        const t = parseHM(it.time);
        items.push({ t: t == null ? startMin : t, kind: 'custom', id: it.id, title: it.title || '(untitled)', sub: '' });
      });
      // stable sort by time keeps travel steps in order when times tie
      items.forEach((it, k) => { it._k = k; });
      items.sort((x, y) => (x.t - y.t) || (x._k - y._k));
      out.push({ items, warns, startMin, endMin: clock, driveH, driveKm });
    });
    return out;
  }

  // ---------- routes drawn on the map ----------
  // Google-style encoded polyline (precision 5), as returned by OSRM. Stored encoded on the trip to keep it small.
  function decodePolyline(str){
    const out = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length){
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (res & 1) ? ~(res >> 1) : (res >> 1);
      shift = 0; res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (res & 1) ? ~(res >> 1) : (res >> 1);
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }

  async function osrmGeometry(a, b){
    const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=simplified&geometries=polyline`;
    const res = await fetch(url);
    const json = await res.json();
    if (!json.routes || !json.routes.length || !json.routes[0].geometry) throw new Error('no route');
    return json.routes[0].geometry;

  function normalizeTrip(t){
    if (!t.budget) t.budget = { fuel:0, ferry:0, tolls:0, accommodation:0, food:0, activities:0, misc:0 };
    if (!t.currencies){ t.currencies = t.currency ? [t.currency] : ['GBP']; }
    if (!t.rates) t.rates = {};
    if (!t.budgetCurrency){
      t.budgetCurrency = {};
      Object.keys(t.budget).forEach(k => { t.budgetCurrency[k] = t.currencies[0]; });
    }
    if (!t.fuel) t.fuel = { efficiency: 45, efficiencyUnit: "mpg", prices: {} };
    if (!t.fuel.prices){
      t.fuel.prices = {};
      t.currencies.forEach((c,i) => { t.fuel.prices[c] = i===0 ? (t.fuel.price||1.5) : 1.6; });
    }
    t.currencies.forEach(c => { if (t.fuel.prices[c] == null) t.fuel.prices[c] = 0; });
    (t.legs||[]).forEach(l => {
      if (!l.costCurrency) l.costCurrency = t.currencies[0];
      if (l.costCurrencyAuto === undefined) l.costCurrencyAuto = true;
    });
    if (!t.packingList) t.packingList = [];
    if (!t.geoV2) t.geoV2 = {};
    if (!t.days) t.days = [];
    if (!t.legs) t.legs = [];
    if (!t.countries) t.countries = [];
    if (!t.preferences) t.preferences = [];
    t.timing = Object.assign({}, DEFAULT_TIMING, t.timing || {});
    if (!t.routeGeo) t.routeGeo = {};
    t.days.forEach(day => { if (!day.items) day.items = []; });
    // Older trips have no auto flag: a leg is automatic if it's empty or already matches the estimate,
    // otherwise the number was typed by hand and is left alone.
    const plan = computeDayPlan(t);
    t.legs.forEach((l, i) => {
      if (l.costAuto !== undefined) return;
      if (!AUTO_MODES.includes(l.mode)){ l.costAuto = false; return; }
      const est = autoCostFor(l, t, plan.legDates[i]);
      const cost = parseFloat(l.cost) || 0;
      l.costAuto = cost === 0 || !!(est && Math.abs(Math.round(est.amount) - cost) <= 1);
    });
    applyAutoCurrencies(t);
    applyAutoCosts(t, plan);
    return t;
  }

  async function fetchRate(from, to){
    if (from === to) return 1;
    const res = await fetch('https://api.frankfurter.dev/v2/rate/'+encodeURIComponent(from)+'/'+encodeURIComponent(to));
    const json = await res.json();
    if (json && typeof json.rate === 'number') return json.rate;
    throw new Error('rate not found');
  }
  function convertToHome(amount, currency, d){
    const home = d.currencies[0];
    if (!currency || currency === home) return amount;
    const rate = d.rates[currency];
    return (typeof rate === 'number' && rate > 0) ? amount * rate : amount;
  }
  function haversineKm(a, b){
    const R = 6371, toRad = x => x*Math.PI/180;
    const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  async function osrmRoute(a, b){
    const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
    const res = await fetch(url);
    const json = await res.json();
    if (!json.routes || !json.routes.length) throw new Error('no route');
    return { distanceKm: json.routes[0].distance/1000, hours: json.routes[0].duration/3600 };
  }
  async function calcLegDistanceTime(leg, btnEl){
    const d = state.draft;
    if (!leg.from.trim() || !leg.to.trim()){ alert('Fill in both the From and To cities first.'); return; }
    const original = btnEl.innerHTML;
    btnEl.disabled = true; btnEl.innerHTML = '…';
    try{
      const a = await geocode(leg.from, d);
      const b = await geocode(leg.to, d);
      if (leg.mode === 'drive' || leg.mode === 'train'){
        try{
          const route = await osrmRoute(a, b);
          leg.distanceKm = Math.round(route.distanceKm);
          leg.hours = Math.round(route.hours*10)/10;
        }catch(e){
          leg.distanceKm = Math.round(haversineKm(a,b));
        }
      } else {
        leg.distanceKm = Math.round(haversineKm(a,b));
      }
      scheduleSave();
      renderLegs();
    }catch(e){
      alert("Couldn't find one of those places — check the spelling, or enter distance/time manually.");
      btnEl.disabled = false; btnEl.innerHTML = original;
    }
  }

  function litersPer100(eff, unit){
    if (!eff || eff <= 0) return 0;
    return unit === 'mpg' ? 282.481/eff : eff;
  }

  function fuelByCurrency(d){
    const f = d.fuel, l100 = litersPer100(f.efficiency, f.efficiencyUnit), out = {};
    (d.legs||[]).filter(l => l.mode === 'drive').forEach(l => {
      const cur = l.costCurrency || d.currencies[0];
      out[cur] = (out[cur]||0) + (parseFloat(l.distanceKm)||0) / 100 * l100 * (f.prices[cur]||0);
    });
    return out;
  }
