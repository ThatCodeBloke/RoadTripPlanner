<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roadbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%A7%AD</text></svg>">
<style>
  :root {
    box-sizing: border-box;
    --ink: #20242C;
    --ink-dim: rgba(32,36,44,0.62);
    --ink-faint: rgba(32,36,44,0.4);
    --bg: #F1EADA;
    --panel: #E7DFC9;
    --panel-2: #DCD2B7;
    --panel-edge: rgba(32,36,44,0.14);
    --route: #3E7C6E;
    --route-soft: rgba(62,124,110,0.16);
    --accent: #C67A2B;
    --accent-soft: rgba(198,122,43,0.16);
    --crossing: #5B67A6;
    --crossing-soft: rgba(91,103,166,0.15);
    --danger: #B14B3E;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ECE7D8;
      --ink-dim: rgba(236,231,216,0.64);
      --ink-faint: rgba(236,231,216,0.4);
      --bg: #12161F;
      --panel: #1B212C;
      --panel-2: #242C39;
      --panel-edge: rgba(236,231,216,0.12);
      --route: #5FA79A;
      --route-soft: rgba(95,167,154,0.16);
      --accent: #E3A23E;
      --accent-soft: rgba(227,162,62,0.16);
      --crossing: #8291D6;
      --crossing-soft: rgba(130,145,214,0.16);
      --danger: #D97C6C;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE7D8;
    --ink-dim: rgba(236,231,216,0.64);
    --ink-faint: rgba(236,231,216,0.4);
    --bg: #12161F;
    --panel: #1B212C;
    --panel-2: #242C39;
    --panel-edge: rgba(236,231,216,0.12);
    --route: #5FA79A;
    --route-soft: rgba(95,167,154,0.16);
    --accent: #E3A23E;
    --accent-soft: rgba(227,162,62,0.16);
    --crossing: #8291D6;
    --crossing-soft: rgba(130,145,214,0.16);
    --danger: #D97C6C;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { font-family: var(--font-display); font-weight: 500; margin: 0; }
  input, select, textarea, button { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--accent-soft); }

  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; padding: 22px clamp(16px,4vw,40px) 14px;
    border-bottom: 1px solid var(--panel-edge);
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .topbar .brand { display:flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 28px; letter-spacing: 0.2px; }
  .topbar .tagline { font-size: 13.5px; color: var(--ink-dim); font-style: italic; font-family: var(--font-display); }
  .sync-badge { font-size: 12px; color: var(--ink-dim); display:flex; align-items:center; gap:6px; white-space: nowrap; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background: var(--route); flex: none; }
  .sync-dot.offline { background: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    max-width: 1180px;
    margin: 0 auto;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    #sidebar { border-right: none; border-bottom: 1px solid var(--panel-edge); }
    #tripList { display:flex; overflow-x:auto; gap:10px; padding-bottom: 4px; }
    .trip-card { min-width: 220px; flex: none; }
  }

  #sidebar { padding: 20px 16px; border-right: 1px solid var(--panel-edge); }
  #newTripBtn {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    border: 1px dashed var(--panel-edge); background: transparent;
    color: var(--ink); font-size: 14px; font-weight: 500;
    margin-bottom: 14px; transition: border-color .15s, background .15s;
  }
  #newTripBtn:hover { border-color: var(--route); background: var(--route-soft); }

  .trip-card {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; padding: 12px 13px; margin-bottom: 9px;
    cursor: pointer; position: relative; transition: transform .12s, border-color .12s;
  }
  .trip-card:hover { border-color: var(--route); }
  .trip-card.active { border-color: var(--route); box-shadow: inset 0 0 0 1px var(--route); }
  .trip-card .name { font-family: var(--font-display); font-size: 16px; margin-bottom: 3px; padding-right: 44px; }
  .trip-card .meta { font-size: 12px; color: var(--ink-dim); }
  .trip-card .route-strip { font-size: 11.5px; color: var(--ink-faint); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-card .card-actions { position: absolute; top: 10px; right: 8px; display:flex; gap:2px; }
  .icon-btn {
    background: none; border: none; padding: 4px; border-radius: 5px;
    color: var(--ink-faint); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover { color: var(--ink); background: var(--panel-2); }
  .icon-btn svg { width:14px; height:14px; }

  #main { padding: 22px clamp(16px,4vw,40px) 60px; min-width: 0; }
  #emptyState { padding: 60px 10px; text-align:center; color: var(--ink-dim); }
  #emptyState h2 { font-size: 22px; margin-bottom: 8px; color: var(--ink); }

  .trip-head input.trip-name {
    font-family: var(--font-display); font-size: 32px; font-weight: 500;
    background: none; border: none; width: 100%; padding: 2px 0; margin-bottom: 10px;
    border-bottom: 1px solid transparent;
  }
  .trip-head input.trip-name:focus { outline: none; border-bottom: 1px solid var(--route); }
  .trip-meta-row { display:flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 18px; font-size: 13.5px; color: var(--ink-dim); }
  .trip-meta-row label { display:flex; align-items:center; gap: 6px; }
  .trip-meta-row input[type=date], .trip-meta-row select, .trip-meta-row input[type=number] {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 5px 8px; font-size: 13px; color: var(--ink);
  }

  .chip-row { display:flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    font-size: 12.5px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--panel-edge); background: var(--panel);
    color: var(--ink-dim); user-select: none;
  }
  .chip.on { border-color: var(--route); background: var(--route-soft); color: var(--ink); }
  .chip.country { display:flex; align-items:center; gap:6px; }
  .chip.country .rm { color: var(--ink-faint); }
  .chip.country .rm:hover { color: var(--danger); }
  .add-country { display:flex; align-items:center; gap:6px; margin-top: 2px; }
  .add-country input {
    background: none; border: none; border-bottom: 1px dashed var(--panel-edge);
    font-size: 12.5px; padding: 4px 2px; width: 130px; color: var(--ink);
  }
  .add-country input:focus { outline:none; border-bottom-color: var(--route); }

  section.block { margin-top: 34px; }
  .block-head { display:flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .block-head h3 { font-size: 20px; }
  .block-head .hint { font-size: 12px; color: var(--ink-faint); }

  .roadbook { position: relative; padding-left: 30px; }
  .roadbook::before {
    content: ""; position:absolute; left: 9px; top: 8px; bottom: 8px; width: 2px;
    background: repeating-linear-gradient(to bottom, var(--panel-edge) 0 6px, transparent 6px 11px);
  }
  .leg {
    position: relative; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; padding: 14px 14px 12px; margin-bottom: 12px;
  }
  .leg::before {
    content: ""; position: absolute; left: -25px; top: 18px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--route);
  }
  .leg[data-mode="ferry"]::before, .leg[data-mode="tunnel"]::before { border-color: var(--crossing); }
  .leg-row1 { display:flex; align-items:center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .leg-row1 input.city {
    font-family: var(--font-display); font-size: 16px; background:none; border:none;
    border-bottom: 1px solid transparent; padding: 2px 1px; min-width: 90px; flex: 1;
  }
  .leg-row1 input.city:focus { outline:none; border-bottom-color: var(--route); }
  .leg-arrow { color: var(--ink-faint); }
  .mode-select {
    display:flex; align-items:center; gap:6px; background: var(--panel-2);
    border: 1px solid var(--panel-edge); border-radius: 7px; padding: 4px 8px;
  }
  .mode-select svg { width:15px; height:15px; color: var(--route); }
  .leg[data-mode="ferry"] .mode-select svg, .leg[data-mode="tunnel"] .mode-select svg { color: var(--crossing); }
  .mode-select select { background:none; border:none; font-size: 12.5px; }
  .leg-row2 { display:flex; flex-wrap: wrap; gap: 14px; align-items:center; font-size: 12.5px; color: var(--ink-dim); }
  .leg-row2 .field { display:flex; align-items:center; gap:5px; }
  .leg-row2 input[type=number] {
    width: 66px; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 4px 6px; font-size: 12.5px;
  }
  .leg-row2 input.notes {
    flex: 1; min-width: 140px; background:none; border:none; border-bottom: 1px dashed transparent;
    font-size: 12.5px; padding: 4px 2px;
  }
  .leg-row2 input.notes:focus { outline:none; border-bottom-color: var(--panel-edge); }
  .leg-controls { display:flex; gap:2px; margin-left:auto; }

  .ghost-btn {
    background: none; border: 1px dashed var(--panel-edge); border-radius: 8px;
    padding: 9px 14px; font-size: 13px; color: var(--ink-dim); margin-left: 30px;
  }
  .ghost-btn:hover { border-color: var(--route); color: var(--ink); }

  .day-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom: 8px; margin-bottom: 14px; }
  .day-tab {
    flex: none; background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 8px; padding: 7px 13px; font-size: 12.5px; white-space: nowrap;
  }
  .day-tab.active { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .day-panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 16px; }
  .day-panel .day-date { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
  .day-panel label { display:block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
  .day-panel input.overnight {
    width: 100%; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 7px 9px; font-size: 13.5px; margin-bottom: 12px;
  }
  .day-panel textarea.plan {
    width: 100%; min-height: 76px; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 9px; font-size: 13px; resize: vertical; line-height: 1.5;
  }

  .budget-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-bottom: 16px; }
  @media (max-width: 520px) { .budget-grid { grid-template-columns: 1fr; } }
  .budget-row { display:flex; align-items:center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 9px 12px; }
  .budget-row label { font-size: 13px; color: var(--ink-dim); }
  .budget-row .amt { display:flex; align-items:center; gap:4px; }
  .budget-row input[type=number] {
    width: 84px; text-align:right; background: var(--panel-2); border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 5px 7px; font-size: 13px;
  }
  .totals-bar { display:flex; flex-wrap:wrap; gap: 22px; align-items: flex-end; margin-top: 8px;
    border-top: 1px solid var(--panel-edge); padding-top: 16px; }
  .totals-bar .tstat { }
  .totals-bar .tstat .label { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 2px; }
  .totals-bar .tstat .val { font-family: var(--font-display); font-size: 26px; }
  .totals-bar .tstat.grand .val { font-size: 38px; color: var(--accent); }
  .split-input { display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--ink-dim); margin-left:auto; }
  .split-input input { width: 44px; background: var(--panel-2); border: 1px solid var(--panel-edge); border-radius:6px; padding: 4px 6px; }

  footer.foot { max-width: 1180px; margin: 20px auto 40px; padding: 0 clamp(16px,4vw,40px);
    font-size: 11.5px; color: var(--ink-faint); }

  #mapHost { height: 420px; border-radius: 10px; overflow: hidden; border: 1px solid var(--panel-edge); background: var(--panel); }
  #mapHost.empty { display: none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
  .leaflet-container { font-family: var(--font-body); }
  #mapStatus { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>Roadbook</h1>
      <span class="tagline">plan the crossing</span>
    </div>
    <div class="sync-badge"><span class="sync-dot offline" id="syncDot"></span><span id="syncText">Checking sync…</span></div>
  </div>

  <div class="layout">
    <aside id="sidebar">
      <button id="newTripBtn">+ New trip</button>
      <div id="tripList"></div>
    </aside>
    <main id="main">
      <div id="emptyState">
        <h2>No trip open</h2>
        <p>Pick one on the left, or start a new one.</p>
      </div>
      <div id="tripPanel" style="display:none;"></div>
    </main>
  </div>

  <footer class="foot" id="footNote"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  // ---------- mode icons ----------
  const ICONS = {
    drive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><line x1="12" y1="3.8" x2="12" y2="7.2"/><line x1="12" y1="16.8" x2="12" y2="20.2"/><line x1="3.8" y1="12" x2="7.2" y2="12"/><line x1="16.8" y1="12" x2="20.2" y2="12"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
    ferry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 15h16l-2 4.5H6L4 15Z"/><path d="M8 15V7h5l3 5"/><line x1="9.5" y1="7" x2="9.5" y2="4"/></svg>',
    tunnel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V11a8 8 0 0 1 16 0v8"/><line x1="4" y1="19" x2="4" y2="21.5"/><line x1="20" y1="19" x2="20" y2="21.5"/></svg>',
    train: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5.5" y="4" width="13" height="13" rx="3"/><line x1="5.5" y1="11" x2="18.5" y2="11"/><circle cx="9" cy="17.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="17.5" r="1.1" fill="currentColor" stroke="none"/><line x1="8" y1="20.3" x2="6" y2="22"/><line x1="16" y1="20.3" x2="18" y2="22"/></svg>',
    flight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 13.5 20 7l-6.5 7L15 21l-3.2-5.3L3 13.5Z"/></svg>'
  };
  const MODES = [
    {id:'drive', label:'Drive'},
    {id:'ferry', label:'Ferry'},
    {id:'tunnel', label:'Eurotunnel'},
    {id:'train', label:'Train'},
    {id:'flight', label:'Flight'}
  ];
  const CURRENCY_SYM = { GBP:'£', EUR:'€', USD:'$' };
  const PREFS = ['Scenic route','Fastest route','Avoid tolls','Family-friendly','Comfort stops','Budget-conscious'];

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'}); }

  function seedTrip(){
    return {
      name: "Nottinghamshire to the Continent",
      startDate: "2026-12-26",
      endDate: "2027-01-01",
      currency: "GBP",
      travelers: 2,
      countries: ["England","France","Belgium","Luxembourg","Netherlands","Germany"],
      preferences: ["Scenic route"],
      legs: [
        {id: uid(), from:"Home, Nottinghamshire", to:"Dover", mode:"drive", distanceKm:280, hours:4, cost:0, notes:"Down through the Midlands, onto the M20"},
        {id: uid(), from:"Dover", to:"Calais", mode:"ferry", distanceKm:34, hours:1.5, cost:0, notes:"Compare against the Eurotunnel — check holiday crossing times"},
        {id: uid(), from:"Calais", to:"Brussels", mode:"drive", distanceKm:200, hours:2.5, cost:0, notes:""},
        {id: uid(), from:"Brussels", to:"Luxembourg City", mode:"drive", distanceKm:220, hours:2.5, cost:0, notes:""},
        {id: uid(), from:"Luxembourg City", to:"Amsterdam", mode:"drive", distanceKm:390, hours:4.5, cost:0, notes:""},
        {id: uid(), from:"Amsterdam", to:"Cologne", mode:"drive", distanceKm:260, hours:3, cost:0, notes:""},
        {id: uid(), from:"Cologne", to:"Calais", mode:"drive", distanceKm:400, hours:4.5, cost:0, notes:"Loop back toward the coast"},
        {id: uid(), from:"Calais", to:"Dover", mode:"ferry", distanceKm:34, hours:1.5, cost:0, notes:""},
        {id: uid(), from:"Dover", to:"Home, Nottinghamshire", mode:"drive", distanceKm:280, hours:4, cost:0, notes:""}
      ],
      days: [],
      budget: { fuel:0, ferry:0, tolls:0, accommodation:0, food:0, activities:0, misc:0 },
      fuel: { efficiency: 45, efficiencyUnit: "mpg", price: 1.55 },
      packingList: [
        {id: uid(), text:"Passports (valid 6+ months)", done:false},
        {id: uid(), text:"GB sticker or GB on numberplate", done:false},
        {id: uid(), text:"Headlamp beam converters (driving on the right)", done:false},
        {id: uid(), text:"Warning triangle + hi-vis vests (per seat)", done:false},
        {id: uid(), text:"Breakdown cover valid for Europe", done:false},
        {id: uid(), text:"Snow socks or chains, screen wash rated for frost", done:false},
        {id: uid(), text:"Euros in cash for tolls/parking", done:false},
        {id: uid(), text:"Phone holder + offline maps downloaded", done:false}
      ],
      geo: {},
      updatedAt: Date.now()
    };
  }
  function blankTrip(){
    return { name:"New trip", startDate:"", endDate:"", currency:"GBP", travelers:2,
      countries:[], preferences:[], legs:[], days:[],
      budget:{ fuel:0, ferry:0, tolls:0, accommodation:0, food:0, activities:0, misc:0 },
      fuel: { efficiency: 45, efficiencyUnit: "mpg", price: 1.55 },
      packingList: [], geo: {}, updatedAt: Date.now() };
  }

  // ---------- storage layer ----------
  // To share trips live with someone else, create a free Firebase project,
  // enable Firestore, and paste your web app config below (see README.md).
  // Leave this as null to run in local-only mode (saved to this browser only).
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAERTUaWGAwE9hIUycoQemL0TWpFDAZudc",
    authDomain: "roadbook-45e27.firebaseapp.com",
    projectId: "roadbook-45e27",
    storageBucket: "roadbook-45e27.firebasestorage.app",
    messagingSenderId: "112486273280",
    appId: "1:112486273280:web:b5f00301d3bb1a4bfee3e5"
  };

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('failed to load '+src));
      document.head.appendChild(s);
    });
  }
  async function loadFirebase(){
    if (window.firebase && window.firebase.firestore) return;
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  }

  const Store = { mode: 'none', fsdb: null, unsub: null,
    async init(onChange){
      this.onChange = onChange;
      if (FIREBASE_CONFIG){
        try{
          await loadFirebase();
          firebase.initializeApp(FIREBASE_CONFIG);
          this.fsdb = firebase.firestore();
          this.mode = 'firebase';
          this._watchFirebase();
          return;
        }catch(e){
          console.warn('Firebase unavailable, falling back to local storage', e);
        }
      }
      this.mode = 'local';
      this._loadLocal();
    },
    _watchFirebase(){
      this.unsub = this.fsdb.collection('trips').onSnapshot((snap) => {
        const trips = {};
        snap.forEach(doc => { trips[doc.id] = Object.assign({id:doc.id}, doc.data()); });
        this.onChange(trips);
      }, (err) => { console.warn('firestore error', err); });
    },
    _loadLocal(){
      let trips = {};
      try{
        const raw = localStorage.getItem('roadbook_trips');
        if (raw) trips = JSON.parse(raw);
      }catch(e){ trips = {}; }
      this._local = trips;
      this.onChange(Object.assign({}, trips));
    },
    _saveLocal(){
      try{ localStorage.setItem('roadbook_trips', JSON.stringify(this._local)); }catch(e){}
      this.onChange(Object.assign({}, this._local));
    },
    async createTrip(data){
      if (this.mode === 'firebase'){
        const ref = await this.fsdb.collection('trips').add(data);
        return ref.id;
      } else {
        const id = uid();
        this._local[id] = Object.assign({id}, data);
        this._saveLocal();
        return id;
      }
    },
    async saveTrip(id, data){
      const payload = Object.assign({}, data, {updatedAt: Date.now()});
      delete payload.id;
      if (this.mode === 'firebase'){
        await this.fsdb.collection('trips').doc(id).set(payload);
      } else {
        this._local[id] = Object.assign({id}, payload);
        this._saveLocal();
      }
    },
    async deleteTrip(id){
      if (this.mode === 'firebase'){
        await this.fsdb.collection('trips').doc(id).delete();
      } else {
        delete this._local[id];
        this._saveLocal();
      }
    }
  };

    const first = state.trips && Object.keys(state.trips).length === 0 && !state._seenOnce;

      state._seeded = true;
      Store.createTrip(seedTrip()).then(id => { selectTrip(id); });
      return;
    }
    if (state.selectedId && trips[state.selectedId] && !isEditingPanel()){
      // refresh from remote if not actively being edited
      const remote = trips[state.selectedId];
      if (!state.draft || remote.updatedAt !== state.draft.updatedAt){
        state.draft = normalizeTrip(JSON.parse(JSON.stringify(remote)));
        renderTripPanel();
      }

    if (state.selectedId && !trips[state.selectedId]){

  // ---------- weather & map shared geocoding ----------
  const geoCache = {};
  async function geocode(place){
    const key = place.trim().toLowerCase();
    if (!key) throw new Error('empty place');
    if (geoCache[key]) return geoCache[key];
    const d = state.draft;
    if (d && d.geo && d.geo[key]){ geoCache[key] = d.geo[key]; return d.geo[key]; }
    const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(place)+'&count=1&language=en&format=json');
    const json = await res.json();
    if (!json.results || !json.results.length) throw new Error('place not found');
    const r = json.results[0];
    const out = {lat: r.latitude, lon: r.longitude, label: r.name + (r.country ? ', '+r.country : '')};
    geoCache[key] = out;
    if (d){ d.geo = d.geo || {}; d.geo[key] = out; scheduleSave(); }
    return out;
  }
  function daysFromToday(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr+'T00:00:00');
    return Math.round((target - today) / 86400000);
  }
  async function fetchWeatherFor(place, dateStr){
    const geo = await geocode(place);
    const diff = daysFromToday(dateStr);
    if (diff >= 0 && diff <= 15){
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
      const json = await res.json();
      if (json.daily && json.daily.time && json.daily.time.length){
        return { source: 'Forecast', place: geo.label, tempMax: json.daily.temperature_2m_max[0], tempMin: json.daily.temperature_2m_min[0], precip: json.daily.precipitation_sum[0] };
      }
    }
    // fall back to a 5-year historical average for this calendar date
    const [y,m,dd] = dateStr.split('-').map(Number);
    const years = [1,2,3,4,5].map(n => y-n);
    const results = await Promise.all(years.map(async yr => {
      const ds = `${yr}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
      try{
        const res = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${geo.lat}&longitude=${geo.lon}&start_date=${ds}&end_date=${ds}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
        const json = await res.json();
        if (json.daily && json.daily.time && json.daily.time.length){
          return { max: json.daily.temperature_2m_max[0], min: json.daily.temperature_2m_min[0], precip: json.daily.precipitation_sum[0] };
        }
      }catch(e){}
      return null;
    }));
    const valid = results.filter(Boolean);
    if (!valid.length) throw new Error('no data');
    const avg = arr => arr.reduce((s,v)=>s+v,0)/arr.length;
    return {
      source: `Typical (${valid.length}-yr avg)`, place: geo.label,
      tempMax: avg(valid.map(v=>v.max)), tempMin: avg(valid.map(v=>v.min)), precip: avg(valid.map(v=>v.precip))
    };
  }

          ${w ? `${w.source} for ${esc(w.place)}: <b style="color:var(--ink)">${Math.round(w.tempMin)}–${Math.round(w.tempMax)}°C</b>, ${w.precip>0.5?'~'+w.precip.toFixed(0)+'mm rain':'dry'}` : (place ? 'Not checked yet' : 'Set an overnight city for this day')}
        </div>

    host.querySelectorAll('.checkWeather').forEach(btn => {

    });

  // ---------- map ----------
  let leafletMap = null, markerLayer = null, lineLayer = null;

  function computeStops(d){
    if (!d.legs || !d.legs.length) return [];
    const stops = [d.legs[0].from, ...d.legs.map(l => l.to)];
    return stops.map(s => (s||'').trim()).filter(Boolean);
  }

  function ensureMap(){
    if (leafletMap) return leafletMap;
    leafletMap = L.map('mapHost', { scrollWheelZoom: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(leafletMap);
    leafletMap.setView([49.5, 5], 5);
    markerLayer = L.layerGroup().addTo(leafletMap);
    return leafletMap;
  }

  function drawMapFromCache(){
    const d = state.draft;
    const host = document.getElementById('mapHost');
    const statusEl = document.getElementById('mapStatus');
    if (!host || !statusEl) return;
    const stops = computeStops(d);
    if (!stops.length){
      host.classList.add('empty');
      statusEl.textContent = 'Add some legs above to see them here.';
      return;
    }
    host.classList.remove('empty');
    const map = ensureMap();
    setTimeout(() => map.invalidateSize(), 0);
    markerLayer.clearLayers();
    if (lineLayer){ map.removeLayer(lineLayer); lineLayer = null; }
    const geo = d.geo || {};
    const pts = [];
    const missing = [];
    stops.forEach((s, i) => {
      const g = geo[s.toLowerCase()];
      if (g){
        pts.push([g.lat, g.lon]);
        const tag = i === 0 ? ' (start)' : (i === stops.length - 1 ? ' (finish)' : '');
        L.marker([g.lat, g.lon]).addTo(markerLayer).bindPopup(`<b>${esc(s)}</b>${tag}`);
      } else if (missing.indexOf(s) === -1){
        missing.push(s);
      }
    });
    if (pts.length > 1){
      const routeColor = getComputedStyle(document.documentElement).getPropertyValue('--route').trim() || '#3E7C6E';
      lineLayer = L.polyline(pts, { color: routeColor, weight: 3 }).addTo(map);
      map.fitBounds(lineLayer.getBounds().pad(0.2));
    } else if (pts.length === 1){
      map.setView(pts[0], 7);
    }
    statusEl.textContent = missing.length
      ? `Couldn't place yet: ${missing.join(', ')} — click "Update map" to look them up.`
      : `${pts.length} stop${pts.length === 1 ? '' : 's'} plotted.`;
  }

  async function updateMap(){
    const d = state.draft;
    const stops = computeStops(d);
    const statusEl = document.getElementById('mapStatus');
    if (statusEl) statusEl.textContent = 'Looking up locations…';
    for (const s of stops){
      try{ await geocode(s); } catch(e){ /* leave as missing, shown after draw */ }
    }
    drawMapFromCache();
  }

  function wireCountryChips(){
    document.getElementById('countryChips').querySelectorAll('.rm').forEach(rm => {
      rm.addEventListener('click', (e) => {
        const i = parseInt(e.target.closest('.chip').dataset.i);
        state.draft.countries.splice(i,1);
        scheduleSave();
        rerenderCountryChips();
      });
    });
  }
  function rerenderCountryChips(){
    const d = state.draft;
    document.getElementById('countryChips').innerHTML = d.countries.map((c,i) =>
      `<span class="chip country" data-i="${i}">${esc(c)} <span class="rm">✕</span></span>`).join('');
    wireCountryChips();
  }

  function renderLegs(){
    const d = state.draft;
    const host = document.getElementById('legList');
    host.innerHTML = d.legs.map((leg, idx) => `
      <div class="leg" data-mode="${leg.mode}" data-idx="${idx}">
        <div class="leg-row1">
          <input class="city" data-f="from" value="${esc(leg.from)}" placeholder="From">
          <span class="leg-arrow">→</span>
          <input class="city" data-f="to" value="${esc(leg.to)}" placeholder="To">
          <span class="mode-select">${ICONS[leg.mode]||ICONS.drive}
            <select data-f="mode">${MODES.map(m => `<option value="${m.id}" ${m.id===leg.mode?'selected':''}>${m.label}</option>`).join('')}</select>
          </span>
          <div class="leg-controls">
            <button class="icon-btn moveup" title="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            <button class="icon-btn movedown" title="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
            <button class="icon-btn removeleg" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></button>
          </div>
        </div>
        <div class="leg-row2">
          <span class="field">dist <input type="number" min="0" data-f="distanceKm" value="${leg.distanceKm||0}"> km</span>
          <span class="field"><input type="number" min="0" step="0.5" data-f="hours" value="${leg.hours||0}"> hrs</span>
          <span class="field">${CURRENCY_SYM[d.currency]||''} <input type="number" min="0" data-f="cost" value="${leg.cost||0}"></span>
          <input class="notes" data-f="notes" value="${esc(leg.notes)}" placeholder="notes…">
          ${(leg.mode==='ferry'||leg.mode==='tunnel') ? `<a class="field" style="color:var(--crossing)" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent((leg.mode==='tunnel'?'Eurotunnel':'ferry')+' '+leg.from+' to '+leg.to+' prices'+(d.startDate?' '+d.startDate:''))}">Check current prices</a>` : ''}
        </div>
      </div>
    `).join('') || '<p style="font-size:12.5px;color:var(--ink-faint)">No legs yet — add the first one.</p>';

    host.querySelectorAll('.leg').forEach(el => {
      const idx = parseInt(el.dataset.idx);
      const leg = d.legs[idx];
      el.querySelectorAll('[data-f]').forEach(inp => {
        const field = inp.dataset.f;
        const ev = (inp.tagName === 'SELECT') ? 'change' : 'input';
        inp.addEventListener(ev, () => {
          let v = inp.value;
          if (['distanceKm','hours','cost'].includes(field)) v = parseFloat(v)||0;
          leg[field] = v;
          scheduleSave();
          if (field === 'mode'){
            el.dataset.mode = v;
            el.querySelector('.mode-select').innerHTML = ICONS[v]+el.querySelector('.mode-select select').outerHTML;
            renderLegs();
          }
          if (field === 'cost') renderTotals();
        });
      });
      el.querySelector('.removeleg').addEventListener('click', () => { d.legs.splice(idx,1); scheduleSave(); renderLegs(); renderTotals(); drawMapFromCache(); });
      el.querySelector('.moveup').addEventListener('click', () => { if(idx>0){ [d.legs[idx-1],d.legs[idx]]=[d.legs[idx],d.legs[idx-1]]; scheduleSave(); renderLegs(); }});
      el.querySelector('.movedown').addEventListener('click', () => { if(idx<d.legs.length-1){ [d.legs[idx+1],d.legs[idx]]=[d.legs[idx],d.legs[idx+1]]; scheduleSave(); renderLegs(); }});
      el.querySelectorAll('input.city').forEach(inp => {
        inp.addEventListener('change', () => drawMapFromCache());
      });
    });
    renderTotals();
    drawMapFromCache();
  }

  function renderDays(){
    const d = state.draft;
    const tabsHost = document.getElementById('dayTabs');
    const panelHost = document.getElementById('dayPanelHost');
    if (!d.days || !d.days.length){
      tabsHost.innerHTML = '';
      panelHost.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint)">Set your dates and generate the day-by-day plan.</p>';
      return;
    }
    let active = parseInt(tripPanelEl.dataset.activeDay || '0');
    if (active >= d.days.length) active = 0;
    tabsHost.innerHTML = d.days.map((day, i) =>
      `<button class="day-tab ${i===active?'active':''}" data-i="${i}">Day ${i+1}<br><span style="opacity:.7">${fmtDate(day.date)}</span></button>`).join('');
    tabsHost.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', () => { tripPanelEl.dataset.activeDay = btn.dataset.i; renderDays(); });
    });
    const day = d.days[active];
    panelHost.innerHTML = `<div class="day-panel">
      <div class="day-date">${fmtDate(day.date)}</div>
      <label>Overnight in</label>
      <input class="overnight" id="dayOvernight" value="${esc(day.overnight)}" placeholder="e.g. Brussels">
      <label>Plan / notes</label>
      <textarea class="plan" id="dayPlan" placeholder="What's happening this day…">${esc(day.notes)}</textarea>
    </div>`;
    document.getElementById('dayOvernight').addEventListener('input', e => { day.overnight = e.target.value; scheduleSave(); renderWeather(); });
    document.getElementById('dayPlan').addEventListener('input', e => { day.notes = e.target.value; scheduleSave(); });
  }

  function renderBudget(){
    const d = state.draft;
    const sym = CURRENCY_SYM[d.currency] || d.currency || '';
    const cats = [['fuel','Fuel'],['ferry','Ferry / Tunnel'],['tolls','Tolls'],['accommodation','Accommodation'],['food','Food & drink'],['activities','Activities'],['misc','Misc']];
    const grid = document.getElementById('budgetGrid');
    grid.innerHTML = cats.map(([key,label]) => `
      <div class="budget-row">
        <label>${label}</label>
        <span class="amt">${sym}<input type="number" min="0" data-cat="${key}" value="${d.budget[key]||0}"></span>
      </div>`).join('');
    grid.querySelectorAll('[data-cat]').forEach(inp => {
      inp.addEventListener('input', () => { d.budget[inp.dataset.cat] = parseFloat(inp.value)||0; scheduleSave(); renderTotals(); });
    });
    renderTotals();
  }

  function renderTotals(){
    const d = state.draft;
    const sym = CURRENCY_SYM[d.currency] || d.currency || '';
    const legTotal = (d.legs||[]).reduce((s,l) => s + (parseFloat(l.cost)||0), 0);
    const budgetTotal = Object.values(d.budget||{}).reduce((s,v) => s + (parseFloat(v)||0), 0);
    const grand = legTotal + budgetTotal;
    const perPerson = grand / Math.max(1, d.travelers||1);
    const bar = document.getElementById('totalsBar');
    if (!bar) return;
    bar.innerHTML = `
      <div class="tstat"><div class="label">Route costs</div><div class="val">${sym}${legTotal.toFixed(0)}</div></div>
      <div class="tstat"><div class="label">Other budget</div><div class="val">${sym}${budgetTotal.toFixed(0)}</div></div>
      <div class="tstat grand"><div class="label">Trip total</div><div class="val">${sym}${grand.toFixed(0)}</div></div>
      <div class="tstat"><div class="label">Per person</div><div class="val" style="font-size:20px">${sym}${perPerson.toFixed(0)}</div></div>
    `;
  }

  document.getElementById('newTripBtn').addEventListener('click', async () => {
    const id = await Store.createTrip(blankTrip());
    selectTrip(id);
  });

  // ---------- boot ----------
  Store.init(onStoreChange).then(() => {
    if (Store.mode === 'firebase'){
      syncDot.classList.remove('offline');
      syncText.textContent = 'Synced live';
      footNote.textContent = 'Trips are stored in your Firebase project and sync live to anyone who opens this page.';
    } else {
      syncDot.classList.add('offline');
      syncText.textContent = 'Saved to this browser only';
      footNote.textContent = 'No live sync is configured, so trips are saved to this browser only. See README.md to add free Firebase sync so you and your mate can edit the same trips.';
    }
  });
})();
</script>
</body>
