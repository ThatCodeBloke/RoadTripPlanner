  // ---------- weather & map shared geocoding ----------
  const geoCache = {};
  const COUNTRY_ALIASES = {
    england: ['united kingdom','uk','england'],
    scotland: ['united kingdom','uk','scotland'],
    wales: ['united kingdom','uk','wales'],
    'northern ireland': ['united kingdom','uk','northern ireland'],
    uk: ['united kingdom','uk'],
    britain: ['united kingdom','uk'],
    holland: ['netherlands','holland']
  };
  function countryMatches(tripCountry, resultCountry){
    const a = (tripCountry||'').trim().toLowerCase();
    const b = (resultCountry||'').trim().toLowerCase();
    if (!a || !b) return false;
    if (a === b || b.includes(a) || a.includes(b)) return true;
    const aliases = COUNTRY_ALIASES[a];
    return !!(aliases && aliases.some(al => b.includes(al)));
  }
  function geocodeVariants(place){
    const variants = [place];
    const noCitySuffix = place.replace(/\s+city$/i, '').trim();
    if (noCitySuffix && noCitySuffix.toLowerCase() !== place.toLowerCase()) variants.push(noCitySuffix);
    if (place.includes(',')){
      const parts = place.split(',').map(p => p.trim()).filter(Boolean);
      if (parts.length > 1){
        variants.push(parts[parts.length - 1]);
        variants.push(parts[0]);
      }
    }
    return [...new Set(variants.filter(Boolean))];
  }
  async function geocodeRaw(query){
    const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=6&language=en&format=json');
    const json = await res.json();
    return json.results || [];
  }
  async function geocode(place, dOverride){
    const key = place.trim().toLowerCase();
    if (!key) throw new Error('empty place');
    const d = dOverride || state.draft;
    if (d && d.geoV2 && d.geoV2[key]){ geoCache[key] = d.geoV2[key]; return d.geoV2[key]; }
    if (geoCache[key]){
      // known from another trip: keep a copy on this one too, so it syncs to everyone
      if (d){ d.geoV2 = d.geoV2 || {}; d.geoV2[key] = geoCache[key]; if (d === state.draft) scheduleSave(); }
      return geoCache[key];
    }
    let candidates = [];
    for (const variant of geocodeVariants(place)){
      candidates = await geocodeRaw(variant);
      if (candidates.length) break;
    }
    if (!candidates.length) throw new Error('place not found');
    const prefCountries = (d && d.countries) || [];
    let r = candidates[0];
    if (prefCountries.length){
      const match = candidates.find(cand => prefCountries.some(pc => countryMatches(pc, cand.country)));
      if (match) r = match;
    }
    const out = {lat: r.latitude, lon: r.longitude, label: r.name + (r.country ? ', '+r.country : '')};
    geoCache[key] = out;
    if (d){ d.geoV2 = d.geoV2 || {}; d.geoV2[key] = out; if (d === state.draft) scheduleSave(); }
    return out;
  }
  function daysFromToday(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr+'T00:00:00');
    return Math.round((target - today) / 86400000);
  }
  async function fetchWeatherFor(place, dateStr){
    const geo = await geocode(place);
    const diff = daysFromToday(dateStr);
    if (diff >= 0 && diff <= 15){
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`);
      const json = await res.json();
      if (json.daily && json.daily.time && json.daily.time.length){
        return { source: 'Forecast', place: geo.label, tempMax: json.daily.temperature_2m_max[0], tempMin: json.daily.temperature_2m_min[0], precip: json.daily.precipitation_sum[0] };
      }
    }
    // fall back to a 5-year historical average for this calendar date
    const [y,m,dd] = dateStr.split('-').map(Number);
    const years = [1,2,3,4,5].map(n => y-n);
    const results = await Promise.all(years.map(async yr => {
      const ds = `${yr}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
      try{
        const res = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${geo.lat}&longitude=${geo.lon}&start_date=${ds}&end_date=${ds}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
        const json = await res.json();
        if (json.daily && json.daily.time && json.daily.time.length){
          return { max: json.daily.temperature_2m_max[0], min: json.daily.temperature_2m_min[0], precip: json.daily.precipitation_sum[0] };
        }
      }catch(e){}
      return null;
    }));
    const valid = results.filter(Boolean);
    if (!valid.length) throw new Error('no data');
    const avg = arr => arr.reduce((s,v)=>s+v,0)/arr.length;
    return {
      source: `Typical (${valid.length}-yr avg)`, place: geo.label,
      tempMax: avg(valid.map(v=>v.max)), tempMin: avg(valid.map(v=>v.min)), precip: avg(valid.map(v=>v.precip))
    };
  }

  // Where to check the weather for a day: the overnight city if set, otherwise the stop the day is estimated to end at
  function placeForDay(d, plan, i){
    const day = d.days[i];
    return (day.overnight || '').trim() || (plan.days[i] && plan.days[i].stop) || (d.legs[i] ? d.legs[i].to : '') || '';
  }

  // Looks up every stop on the route (cached on the trip), fills in real distances for legs that have none,
  // then refreshes currencies, costs, day estimates and the map. Safe to call repeatedly.
  function resolveTripPlaces(){
    const d = state.draft;
    if (!d) return Promise.resolve();
    if (state._resolving && state._resolving.d === d){ state._resolveAgain = true; return state._resolving.p; }
    const rec = { d, p: null };
    state._resolving = rec;
    rec.p = (async () => {
      try{
        do{
          state._resolveAgain = false;
          for (const name of new Set(computeStops(d))){
            if (state.draft !== d) return;
            const key = name.toLowerCase();
            if (geoFor(d, name) && !(d.geoV2 && d.geoV2[key])){ await geocode(name, d); continue; }
            if (geoFor(d, name)) continue;
            if (state._geoFailed && state._geoFailed.has(key)) continue;
            try{ await geocode(name, d); }
            catch(e){ (state._geoFailed = state._geoFailed || new Set()).add(key); }
          }
          // legs with no distance yet: fill it in (real road distance for drives, straight-line otherwise)
          let filled = false;
          for (const leg of d.legs){
            if (state.draft !== d) return;
            if ((parseFloat(leg.distanceKm)||0) > 0 || !(leg.from||'').trim() || !(leg.to||'').trim()) continue;
            const a = geoFor(d, leg.from), b = geoFor(d, leg.to);
            if (!a || !b) continue;
            if (leg.mode === 'drive' || leg.mode === 'train'){
              try{
                const r = await osrmRoute(a, b);
                leg.distanceKm = Math.round(r.distanceKm);
                if (!(parseFloat(leg.hours)>0)) leg.hours = Math.round(r.hours*10)/10;
              }catch(e){ leg.distanceKm = Math.round(haversineKm(a, b)); }
            } else {
              leg.distanceKm = Math.round(haversineKm(a, b));
            }
            filled = true;
          }
          if (filled) scheduleSave();
          // road geometry for drive legs, so the map follows real roads (one request per leg, cached on the trip)
          d.routeGeo = d.routeGeo || {};
          for (const leg of d.legs){
            if (state.draft !== d) return;
            if (leg.mode !== 'drive') continue;
            const key = routeKey(leg);
            if (d.routeGeo[key] || (state._routeFailed && state._routeFailed.has(key))) continue;
            const a = geoFor(d, leg.from), b = geoFor(d, leg.to);
            if (!a || !b) continue;
            try{
              d.routeGeo[key] = await osrmGeometry(a, b);
              scheduleSave();
              if (state.draft === d) drawMapFromCache();
            }catch(e){ (state._routeFailed = state._routeFailed || new Set()).add(key); }
          }
        } while (state._resolveAgain);
        // drop cached roads for legs that no longer exist
        const used = new Set(d.legs.filter(l => l.mode === 'drive').map(routeKey));
        let pruned = false;
        Object.keys(d.routeGeo || {}).forEach(k => { if (!used.has(k)){ delete d.routeGeo[k]; pruned = true; } });
        if (pruned && state.draft === d) scheduleSave();
      } finally {
        if (state._resolving === rec) state._resolving = null;
      }
      if (state.draft === d){
        refreshAuto();
        renderWeather();
        drawMapFromCache();
      }
    })();
    return rec.p;
  }

  function renderWeather(){
    const d = state.draft;
    const host = document.getElementById('weatherList');
    if (!host) return;
    if (!d.days || !d.days.length){
      host.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint)">Generate the day-by-day plan first, then check the weather for each stop.</p>';
      return;
    }
    const plan = computeDayPlan(d);
    host.innerHTML = `<div class="budget-grid">` + d.days.map((day,i) => {
      const place = placeForDay(d, plan, i);
      const w = day.weather;
      return `<div class="budget-row" data-day="${i}" style="flex-direction:column;align-items:stretch;gap:6px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <label style="font-size:13px">${fmtDate(day.date)} — ${esc(place || 'no city set')}</label>
          <button class="icon-btn checkWeather" title="Check weather" data-day="${i}" ${place?'':'disabled'}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
        </div>
        <div class="weatherResult" style="font-size:12.5px;color:var(--ink-dim);">
          ${w ? `${w.source} for ${esc(w.place)}: <b style="color:var(--ink)">${Math.round(w.tempMin)}–${Math.round(w.tempMax)}°C</b>, ${w.precip>0.5?'~'+w.precip.toFixed(0)+'mm rain':'dry'}` : (place ? 'Not checked yet' : 'Set an overnight city for this day')}
        </div>
      </div>`;
    }).join('') + `</div>`;
    host.querySelectorAll('.checkWeather').forEach(btn => {
      btn.addEventListener('click', async () => {
        const i = parseInt(btn.dataset.day);
        const day = d.days[i];
        const place = placeForDay(d, computeDayPlan(d), i);
        if (!place) return;
        const resultEl = btn.closest('[data-day]').querySelector('.weatherResult');
        resultEl.textContent = 'Checking…';
        try{
          const w = await fetchWeatherFor(place, day.date);
          day.weather = w;
          scheduleSave();
          renderWeather();
        }catch(e){
          resultEl.textContent = "Couldn't find weather for that place — check the spelling.";
        }
      });
    });
  }

  // ---------- map ----------
  let leafletMap = null, markerLayer = null, lineLayer = null, legendEl = null, lastFitSig = '', leafletLoading = null;

  function computeStops(d){
    if (!d.legs || !d.legs.length) return [];
    const stops = [d.legs[0].from, ...d.legs.map(l => l.to)];
    return stops.map(s => (s||'').trim()).filter(Boolean);
  }

  // If the page's own Leaflet copy didn't load (blocked or offline at the time), try a second CDN once.
  function withLeaflet(cb, statusEl){
    if (window.L && window.L.map) return cb();
    if (!leafletLoading){
      leafletLoading = (async () => {
        const css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(css);
        await loadScript('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js');
      })();
    }
    leafletLoading.then(() => { if (window.L) cb(); }).catch(() => {
      leafletLoading = null;
      if (statusEl) statusEl.textContent = "The map library didn't load (network, or an ad-blocker?). Reload the page to try again.";
    });
  }

  function ensureMap(){
    const host = document.getElementById('mapHost');
    // The trip panel is rebuilt whenever a trip is opened or a synced edit lands, which replaces #mapHost with
    // a fresh element. A map object made earlier is still attached to the discarded one and would draw into
    // nothing (a blank grey box), so drop it and build a new one on the current element.
    if (leafletMap && leafletMap.getContainer() !== host){
      try{ leafletMap.remove(); }catch(e){}
      leafletMap = markerLayer = lineLayer = legendEl = null;
      lastFitSig = '';
    }
    if (leafletMap) return leafletMap;
    leafletMap = L.map(host, { scrollWheelZoom: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    }).addTo(leafletMap);
    leafletMap.setView([49.5, 5], 5);
    markerLayer = L.layerGroup().addTo(leafletMap);
    return leafletMap;
  }

  function drawMapFromCache(){
    const host = document.getElementById('mapHost');
    const statusEl = document.getElementById('mapStatus');
    const d = state.draft;
    if (!host || !statusEl || !d) return;
    if (!computeStops(d).length){
      host.classList.add('empty');
      statusEl.textContent = 'Add some legs above to see them here.';
      return;
    }
    withLeaflet(() => {
      try{ drawMapNow(); }
      catch(e){
        console.error('Map draw failed', e);
        const el = document.getElementById('mapStatus');
        if (el) el.textContent = 'The map hit an error (' + e.message + '). Try "Update map".';
      }
    }, statusEl);
  }

  function drawMapNow(){
    const d = state.draft;
    const host = document.getElementById('mapHost');
    const statusEl = document.getElementById('mapStatus');
    if (!d || !host || !statusEl) return;
    const stops = computeStops(d);
    if (!stops.length) return;
    host.classList.remove('empty');
    const map = ensureMap();
    setTimeout(() => { try{ map.invalidateSize(); }catch(e){} }, 0);
    markerLayer.clearLayers();
    if (lineLayer){ map.removeLayer(lineLayer); lineLayer = null; }
    const geo = d.geoV2 || {};
    const pts = [];
    const missing = [];
    stops.forEach((s, i) => {
      const g = geo[s.toLowerCase()];
      if (g){
        pts.push([g.lat, g.lon]);
        const tag = i === 0 ? ' (start)' : (i === stops.length - 1 ? ' (finish)' : '');
        L.marker([g.lat, g.lon]).addTo(markerLayer).bindPopup(`<b>${i + 1}. ${esc(s)}</b>${tag}`);
      } else if (missing.indexOf(s) === -1){
        missing.push(s);
      }
    });

    // ---- directional legs: outbound vs return ----
    const css = getComputedStyle(document.documentElement);
    const outColor = css.getPropertyValue('--route').trim() || '#3E7C6E';
    const backColor = css.getPropertyValue('--accent').trim() || '#C67A2B';

    // Stops in order, with coordinates (null if not geocoded yet)
    const seq = stops.map(s => { const g = geo[s.toLowerCase()]; return g ? { name: s, lat: g.lat, lon: g.lon } : null; });
    const first = seq.find(Boolean);
    // Turnaround = the stop furthest from the start. Everything up to it is "outbound", the rest "return".
    let turnIdx = seq.length - 1;
    if (first){
      let best = -1;
      seq.forEach((p, i) => {
        if (!p) return;
        const dist = Math.hypot(p.lat - first.lat, (p.lon - first.lon) * Math.cos(first.lat * Math.PI / 180));
        if (dist > best){ best = dist; turnIdx = i; }
      });
    }

    const merc = (p) => L.Projection.SphericalMercator.project(L.latLng(p.lat, p.lon));
    const mercPt = (ll) => L.Projection.SphericalMercator.project(L.latLng(ll[0], ll[1]));

    // Fallback when there's no real route yet: a curve bowed to the right of travel, so out and back separate.
    const bowedPath = (a, b) => {
      const A = merc(a), B = merc(b);
      const dx = B.x - A.x, dy = B.y - A.y;
      const len = Math.hypot(dx, dy) || 1;
      const C = L.point((A.x + B.x) / 2 + (dy / len) * 0.16 * len, (A.y + B.y) / 2 - (dx / len) * 0.16 * len);
      const out = [];
      for (let k = 0; k <= 28; k++){
        const t = k / 28, u = 1 - t;
        const ll = L.Projection.SphericalMercator.unproject(L.point(
          u * u * A.x + 2 * u * t * C.x + t * t * B.x, u * u * A.y + 2 * u * t * C.y + t * t * B.y));
        out.push([ll.lat, ll.lng]);
      }
      return out;
    };
    // Ferries, the tunnel and trains: a straight line, via sea waypoints where a straight line would cross land
    const linePath = (leg, a, b) => {
      let via = [];
      const pa = portId(leg.from), pb = portId(leg.to);
      const r = ROUTES.find(x => (x.a === pa && x.b === pb) || (x.a === pb && x.b === pa));
      if (r && r.via) via = (r.a === pa) ? r.via : r.via.slice().reverse();
      return [[a.lat, a.lon]].concat(via, [[b.lat, b.lon]]);
    };
    // Point a fraction of the way along a path, and the direction of travel there
    const pointAlong = (path, frac) => {
      const P = path.map(mercPt);
      const cum = [0];
      for (let i = 1; i < P.length; i++) cum.push(cum[i-1] + Math.hypot(P[i].x - P[i-1].x, P[i].y - P[i-1].y));
      const total = cum[cum.length - 1] || 1;
      const at = (sd) => {
        sd = Math.max(0, Math.min(total, sd));
        let i = 1; while (i < cum.length - 1 && cum[i] < sd) i++;
        const seg = (cum[i] - cum[i-1]) || 1, u = (sd - cum[i-1]) / seg;
        return { x: P[i-1].x + (P[i].x - P[i-1].x) * u, y: P[i-1].y + (P[i].y - P[i-1].y) * u };
      };
      const c = at(total * frac), p1 = at(total * frac - total * 0.02), p2 = at(total * frac + total * 0.02);
      return { ll: L.Projection.SphericalMercator.unproject(L.point(c.x, c.y)), deg: Math.atan2(-(p2.y - p1.y), p2.x - p1.x) * 180 / Math.PI };
    };

    lineLayer = L.featureGroup().addTo(map);
    const drawn = [];
    let roadsFollowed = 0, driveLegs = 0, hasReturn = false, hasLine = false, hasGuess = false;
    for (let i = 0; i < seq.length - 1; i++){
      const a = seq[i], b = seq[i + 1];
      if (!a || !b) continue;
      const leg = d.legs[i] || {};
      const mode = leg.mode || 'drive';
      const isReturn = i >= turnIdx;
      if (isReturn) hasReturn = true;
      let path = null, kind = 'line';
      if (mode === 'drive'){
        driveLegs++;
        const enc = d.routeGeo && d.routeGeo[routeKey(leg)];
        if (enc){ try{ path = decodePolyline(enc); }catch(e){ path = null; } }
        if (path && path.length > 1){ roadsFollowed++; kind = 'road'; }
        else { path = bowedPath(a, b); kind = 'guess'; hasGuess = true; }
      } else if (mode === 'flight'){ path = bowedPath(a, b); kind = 'line'; hasLine = true; }
      else { path = linePath(leg, a, b); kind = 'line'; hasLine = true; }
      drawn.push({ i, a, b, mode, isReturn, path, kind });
    }
    // Outbound first (thick), return on top (thin), so a road driven both ways shows both colours
    drawn.sort((x, y) => (x.isReturn - y.isReturn) || (x.i - y.i));
    const modeName = { drive:'drive', ferry:'ferry', tunnel:'Eurotunnel', train:'train', flight:'flight' };
    drawn.forEach(g => {
      const color = g.isReturn ? backColor : outColor;
      const weight = g.isReturn ? 3.5 : 6;
      const dash = g.kind === 'road' ? null : (g.kind === 'guess' ? '7 8' : '2 9');
      L.polyline(g.path, { color, weight: g.kind === 'line' ? weight - 1 : weight, opacity: g.kind === 'guess' ? 0.6 : 0.9, dashArray: dash, lineCap: 'round', lineJoin: 'round' })
        .addTo(lineLayer)
        .bindTooltip(`${g.i + 1}. ${esc(g.a.name)} → ${esc(g.b.name)} · ${g.isReturn ? 'return' : 'outbound'} · ${modeName[g.mode] || g.mode}`, { sticky: true });
    });
    drawn.forEach(g => {
      const color = g.isReturn ? backColor : outColor;
      // 0.4 along each leg: on a road driven both ways the two arrows land in different places
      const pt = pointAlong(g.path, 0.4);
      L.marker(pt.ll, {
        interactive: false, keyboard: false,
        icon: L.divIcon({
          className: 'leg-arrow-icon', iconSize: [20, 20], iconAnchor: [10, 10],
          html: `<svg width="20" height="20" viewBox="-10 -10 20 20" style="transform:rotate(${pt.deg}deg)"><path d="M-6 -6 L7 0 L-6 6 L-2 0 Z" fill="${color}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>`
        })
      }).addTo(lineLayer);
    });

    // Legend
    if (!legendEl){
      const Legend = L.Control.extend({
        options: { position: 'bottomleft' },
        onAdd(){ legendEl = L.DomUtil.create('div', 'map-legend'); return legendEl; }
      });
      new Legend().addTo(map);
    }
    const sw = (col, w, style) => `<span class="sw" style="border-color:${col};border-top-width:${w}px;border-top-style:${style || 'solid'}"></span>`;
    legendEl.innerHTML =
      (hasReturn ? `<div>${sw(outColor, 6)}Outbound</div><div>${sw(backColor, 3.5)}Return</div>` : `<div>${sw(outColor, 6)}Route (arrows show direction)</div>`) +
      (hasLine ? `<div>${sw('var(--ink-dim)', 3, 'dotted')}Ferry / tunnel / train / flight</div>` : '') +
      (hasGuess ? `<div>${sw('var(--ink-dim)', 3, 'dashed')}Approximate, road not loaded</div>` : '');

    // Only re-frame the map when the set of stops actually changed, so redraws don't undo your panning/zoom.
    const sig = pts.map(p => p.join(',')).join('|');
    if (sig !== lastFitSig){
      lastFitSig = sig;
      if (pts.length > 1){
        map.fitBounds(L.latLngBounds(pts).pad(0.25));
      } else if (pts.length === 1){
        map.setView(pts[0], 7);
      }
    }
    statusEl.textContent = missing.length
      ? `Couldn't place yet: ${missing.join(', ')} — click "Update map" to look them up.`
      : `${pts.length} stop${pts.length === 1 ? '' : 's'} plotted` +
        (driveLegs ? ` · following real roads on ${roadsFollowed} of ${driveLegs} drive leg${driveLegs === 1 ? '' : 's'}${roadsFollowed < driveLegs ? (state._resolving ? ' (loading…)' : ' — click "Update map" to retry the rest') : ''}.` : '.');
  }

  async function updateMap(){
    const statusEl = document.getElementById('mapStatus');
    if (statusEl) statusEl.textContent = 'Looking up locations…';
    state._geoFailed = new Set();
    state._routeFailed = new Set();
    await resolveTripPlaces();
    drawMapFromCache();
  }

  function wireCountryChips(){
    document.getElementById('countryChips').querySelectorAll('.rm').forEach(rm => {
      rm.addEventListener('click', (e) => {
        const i = parseInt(e.target.closest('.chip').dataset.i);
        state.draft.countries.splice(i,1);
        scheduleSave();
        rerenderCountryChips();
      });
    });
  }
  function rerenderCountryChips(){
    const d = state.draft;
    document.getElementById('countryChips').innerHTML = d.countries.map((c,i) =>
      `<span class="chip country" data-i="${i}">${esc(c)} <span class="rm">✕</span></span>`).join('');
    wireCountryChips();
  }

  function renderLegs(){
    const d = state.draft;
    const host = document.getElementById('legList');
    const plan = computeDayPlan(d);
    applyAutoCurrencies(d);
    applyAutoCosts(d, plan);
    host.innerHTML = d.legs.map((leg, idx) => `
      <div class="leg" data-mode="${leg.mode}" data-idx="${idx}">
        <div class="leg-row1">
          <input class="city" data-f="from" value="${esc(leg.from)}" placeholder="From">
          <span class="leg-arrow">→</span>
          <input class="city" data-f="to" value="${esc(leg.to)}" placeholder="To">
          <span class="mode-select">${ICONS[leg.mode]||ICONS.drive}
            <select data-f="mode">${MODES.map(m => `<option value="${m.id}" ${m.id===leg.mode?'selected':''}>${m.label}</option>`).join('')}</select>
          </span>
          <div class="leg-controls">
            <button class="icon-btn moveup" title="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            <button class="icon-btn movedown" title="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
            <button class="icon-btn removeleg" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></button>
          </div>
        </div>
        <div class="leg-row2">
          <span class="field">dist <input type="number" min="0" data-f="distanceKm" value="${leg.distanceKm||0}"> km${(leg.mode!=='drive'&&leg.mode!=='train') ? '<span style="color:var(--ink-faint);font-size:11px;margin-left:2px">(straight-line)</span>' : ''}</span>
          <span class="field"><input type="number" min="0" step="0.5" data-f="hours" value="${leg.hours||0}"> hrs</span>
          <button class="icon-btn calcLeg" title="Auto-calculate distance &amp; time" data-idx="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M4.5 15a8 8 0 0 0 14 3.5M19.5 9A8 8 0 0 0 5.5 5.5"/></svg></button>
          <span class="field">Cost
            <select class="costCur" data-idx="${idx}">${d.currencies.map(c => `<option value="${c}" ${c===(leg.costCurrency||d.currencies[0])?'selected':''}>${c}</option>`).join('')}</select>
            <input type="number" min="0" data-f="cost" value="${leg.cost||0}">
            ${AUTO_MODES.includes(leg.mode) ? '<button type="button" class="auto-chip"></button>' : ''}
          </span>
          <input class="notes" data-f="notes" value="${esc(leg.notes)}" placeholder="notes…">
          ${(leg.mode==='ferry'||leg.mode==='tunnel') ? `<span class="field" title="Optional: the sailing or train you've booked. Leave blank and the itinerary uses the earliest one after check-in.">${leg.mode==='tunnel'?'Train':'Sailing'} <input type="time" data-f="departTime" value="${esc(leg.departTime||'')}"></span>` : ''}
          ${(leg.mode==='ferry'||leg.mode==='tunnel') ? `<a class="field" style="color:var(--crossing)" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent((leg.mode==='tunnel'?'Eurotunnel':'ferry')+' '+leg.from+' to '+leg.to+' prices'+(d.startDate?' '+d.startDate:''))}">Check current prices</a>` : ''}
        </div>
      </div>
    `).join('') || '<p style="font-size:12.5px;color:var(--ink-faint)">No legs yet — add the first one.</p>';

    host.querySelectorAll('.leg').forEach(el => {
      const idx = parseInt(el.dataset.idx);
      const leg = d.legs[idx];
      el.querySelectorAll('[data-f]').forEach(inp => {
        const field = inp.dataset.f;
        const ev = (inp.tagName === 'SELECT') ? 'change' : 'input';
        inp.addEventListener(ev, () => {
          let v = inp.value;
          if (['distanceKm','hours','cost'].includes(field)) v = parseFloat(v)||0;
          leg[field] = v;
          scheduleSave();
          if (field === 'mode'){
            leg.costAuto = AUTO_MODES.includes(v);
            el.dataset.mode = v;
            el.querySelector('.mode-select').innerHTML = ICONS[v]+el.querySelector('.mode-select select').outerHTML;
            renderLegs();
          }
          if (field === 'cost'){
            if (AUTO_MODES.includes(leg.mode)){
              leg.costAuto = false;
              const chip = el.querySelector('.auto-chip');
              if (chip) paintChip(chip, leg, idx, d, computeDayPlan(d));
            }
            renderTotals();
          }
          if (['distanceKm','hours','from','to','departTime'].includes(field)) refreshAuto();
        });
      });
      const chip = el.querySelector('.auto-chip');
      if (chip){
        paintChip(chip, leg, idx, d, plan);
        chip.addEventListener('click', () => {
          if (leg.costAuto !== false) return;
          const ci = el.querySelector('input[data-f="cost"]');
          if (ci && document.activeElement === ci) ci.blur();   // let the field take the new figure
          leg.costAuto = true;
          scheduleSave();
          refreshAuto();
        });
      }
      el.querySelector('.calcLeg').addEventListener('click', () => calcLegDistanceTime(leg, el.querySelector('.calcLeg')));
      el.querySelector('.costCur').addEventListener('change', (e) => {
        leg.costCurrency = e.target.value;
        leg.costCurrencyAuto = false;
        scheduleSave();
        refreshAuto();
      });
      el.querySelector('.removeleg').addEventListener('click', () => { d.legs.splice(idx,1); scheduleSave(); renderLegs(); });
      el.querySelector('.moveup').addEventListener('click', () => { if(idx>0){ [d.legs[idx-1],d.legs[idx]]=[d.legs[idx],d.legs[idx-1]]; scheduleSave(); renderLegs(); }});
      el.querySelector('.movedown').addEventListener('click', () => { if(idx<d.legs.length-1){ [d.legs[idx+1],d.legs[idx]]=[d.legs[idx],d.legs[idx+1]]; scheduleSave(); renderLegs(); }});
      el.querySelectorAll('input.city').forEach(inp => {
        inp.addEventListener('change', () => { drawMapFromCache(); resolveTripPlaces(); });
      });
    });
    renderTotals();
    renderDayOverview();
    drawMapFromCache();
  }

  function renderTimingSettings(){
    const d = state.draft;
    const host = document.getElementById('timingSettings');
    if (!host) return;
    const T = d.timing;
    host.innerHTML = `
      <label>Default start <input type="time" id="tmStart" value="${esc(T.start)}"></label>
      <label>Break every <input type="number" min="0" step="0.5" id="tmEvery" value="${T.breakEveryH}"> h for <input type="number" min="0" step="5" id="tmBreak" value="${T.breakMin}"> min</label>
      <label>Ferry check-in <input type="number" min="0" step="5" id="tmFerry" value="${T.ferryCheckinMin}"> min</label>
      <label>Tunnel check-in <input type="number" min="0" step="5" id="tmTunnel" value="${T.tunnelCheckinMin}"> min</label>`;
    const bind = (id, key, num) => document.getElementById(id).addEventListener('input', e => {
      T[key] = num ? (parseFloat(e.target.value) || 0) : e.target.value;
      scheduleSave(); renderItinerary();
    });
    bind('tmStart', 'start', false); bind('tmEvery', 'breakEveryH', true); bind('tmBreak', 'breakMin', true);
    bind('tmFerry', 'ferryCheckinMin', true); bind('tmTunnel', 'tunnelCheckinMin', true);
  }

  function renderItinerary(){
    const d = state.draft;
    const host = document.getElementById('itineraryList');
    if (!host || !d) return;
    const ae = document.activeElement;
    if (ae && host.contains(ae) && ae.classList.contains('newTitle')) return;   // don't wipe a half-typed item
    const title = document.getElementById('printTitle');
    if (title) title.innerHTML = `<h2 style="font-size:24px;margin-bottom:2px">${esc(d.name || 'Trip')}</h2><p style="margin:0 0 14px;color:var(--ink-dim)">${(d.startDate && d.endDate) ? esc(fmtDate(d.startDate) + ' – ' + fmtDate(d.endDate)) : ''}</p>`;
    if (!d.days || !d.days.length){
      host.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint)">Generate the day-by-day plan above and the timed itinerary will appear here.</p>';
      return;
    }
    if (!d.legs.length){
      host.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint)">Add some legs to the roadbook to build the itinerary.</p>';
      return;
    }
    const plan = computeDayPlan(d), itin = computeItinerary(d, plan);
    host.innerHTML = d.days.map((day, i) => {
      const p = plan.days[i] || { countries: [] }, it = itin[i];
      const stats = it.driveH > 0 ? `${it.driveKm ? it.driveKm + ' km · ' : ''}${fmtDur(it.driveH * 60)} driving` : '';
      return `<div class="it-day" data-i="${i}">
        <div class="it-head">
          <span class="it-dayname">Day ${i+1} · ${esc(fmtDate(day.date))}</span>
          <span class="it-where">${esc(p.countries.join(' → '))}${stats ? (p.countries.length ? ' · ' : '') + esc(stats) : ''}</span>
          <label class="it-start">Start <input type="time" class="dayStart" value="${esc(day.start || '')}" placeholder="${esc(d.timing.start)}"></label>
        </div>
        <ul class="it-list">${it.items.map(x => `
          <li class="it-item ${x.kind}">
            <span class="it-time">${esc(fmtHM(x.t))}</span>
            <div><div class="it-title">${esc(x.title)}</div>${x.sub ? `<div class="it-sub">${esc(x.sub)}</div>` : ''}</div>
            ${x.kind === 'custom' ? `<button class="icon-btn it-rm no-print" data-id="${esc(x.id)}" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : '<span></span>'}
          </li>`).join('')}</ul>
        ${it.warns.map(w => `<p class="it-warn">${esc(w)}</p>`).join('')}
        ${day.notes ? `<p class="it-sub" style="margin-top:8px">Notes: ${esc(day.notes)}</p>` : ''}
        <div class="it-add no-print">
          <input type="time" class="newTime" title="Time (optional)">
          <input class="newTitle" placeholder="Add a stop, meal or booking…">
          <button type="button" class="itAddBtn">Add</button>
        </div>
      </div>`;
    }).join('');
    host.querySelectorAll('.it-day').forEach(card => {
      const day = d.days[parseInt(card.dataset.i)];
      card.querySelector('.dayStart').addEventListener('change', e => { day.start = e.target.value; scheduleSave(); renderItinerary(); });
      const add = () => {
        const t = card.querySelector('.newTitle').value.trim();
        if (!t) return;
        day.items.push({ id: uid(), time: card.querySelector('.newTime').value, title: t });
        scheduleSave();
        card.querySelector('.newTitle').blur();
        renderItinerary();
      };
      card.querySelector('.itAddBtn').addEventListener('click', add);
      card.querySelector('.newTitle').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } });
      card.querySelectorAll('.it-rm').forEach(btn => btn.addEventListener('click', () => {
        day.items = day.items.filter(x => x.id !== btn.dataset.id);
        scheduleSave(); renderItinerary();
      }));
    });
  }

  async function copyItinerary(btn){
    const text = itineraryText(state.draft);
    let ok = false;
    try{ await navigator.clipboard.writeText(text); ok = true; }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ ok = document.execCommand('copy'); }catch(err){}
      ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = ok ? 'Copied' : "Couldn't copy";
    setTimeout(() => { btn.textContent = old; }, 1600);
  }
  function printItinerary(){
    document.body.classList.add('print-itin');
    const done = () => { document.body.classList.remove('print-itin'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
  }

  function renderDayOverview(){
    const d = state.draft;
    const host = document.getElementById('dayOverview');
    if (!host || !d) return;
    if (!d.days || !d.days.length){ host.innerHTML = ''; return; }
    const plan = computeDayPlan(d);
    const active = parseInt(tripPanelEl.dataset.activeDay || '0');
    const resolving = !!state._resolving;
    let notes = '';
    if (plan.leftover > 0.25 && d.legs.length){
      notes += `<p class="est-note" style="color:var(--danger)">The route needs about ${plan.leftover.toFixed(1)} more hours of travel than these dates allow. Extend the dates, or check the overnight stops you've set.</p>`;
    }
    if (plan.missingGeo){
      notes += `<p class="est-note">${resolving ? 'Looking up places…' : `${plan.missingGeo} place${plan.missingGeo===1?'':'s'} couldn't be located yet, so countries may be missing. Check the spelling, or click "Update map" to retry.`}</p>`;
    }
    host.innerHTML = `<p class="est-note">A rough guide to where you'll be each day, worked out from the legs' travel times and your dates. Fill in “Overnight in” on a day to pin it down and the other days will adjust around it. Countries you only pass through on a long leg may not show.</p>` + notes +
      d.days.map((day, i) => {
        const p = plan.days[i] || { countries: [], hours: 0, near: '' };
        const cs = p.countries.length
          ? p.countries.map(c => `<span>${esc(c)}</span>`).join('<span class="arr">→</span>')
          : '<span class="dim">not worked out yet</span>';
        const hrs = Math.round(p.hours * 2) / 2;
        const line2 = (day.overnight ? `Overnight in ${esc(day.overnight)}` : esc(p.near || '')) + (hrs > 0 ? `${(day.overnight || p.near) ? ' · ' : ''}about ${hrs} h on the move` : ((day.overnight || p.near) ? ' · rest day' : ''));
        return `<button type="button" class="day-row ${i===active?'active':''}" data-i="${i}">
          <span class="when">Day ${i+1} · ${fmtDate(day.date)}</span>
          <span class="where">${cs}</span>
          <span class="near">${line2}</span>
        </button>`;
      }).join('');
    host.querySelectorAll('.day-row').forEach(btn => {
      btn.addEventListener('click', () => { tripPanelEl.dataset.activeDay = btn.dataset.i; renderDays(); });
    });
    paintDayEstimate(plan);
  }

  function paintDayEstimate(plan){
    const d = state.draft;
    const el = document.getElementById('dayEst');
    if (!el) return;
    const i = parseInt(tripPanelEl.dataset.activeDay || '0');
    const p = plan.days[i], day = d.days[i];
    if (!p || !day){ el.innerHTML = ''; return; }
    const cs = p.countries.length ? p.countries.map(esc).join(' → ') : 'not worked out yet';
    el.innerHTML = `Likely in: <b>${cs}</b>${p.near ? ' · ' + esc(p.near) : ''}` +
      ((!day.overnight && p.suggest) ? `<button type="button" class="linklike" id="useSuggest">Use ${esc(shortName(p.suggest))} as overnight</button>` : '');
    const btn = document.getElementById('useSuggest');
    if (btn) btn.addEventListener('click', () => {
      day.overnight = p.suggest;
      scheduleSave();
      renderDays();
      renderWeather();
      refreshAuto();
    });
  }

  function renderDays(){
    const d = state.draft;
    const tabsHost = document.getElementById('dayTabs');
    const panelHost = document.getElementById('dayPanelHost');
    if (!d.days || !d.days.length){
      tabsHost.innerHTML = '';
      panelHost.innerHTML = '<p style="font-size:12.5px;color:var(--ink-faint)">Set your dates and generate the day-by-day plan.</p>';
      renderDayOverview();
      return;
    }
    let active = parseInt(tripPanelEl.dataset.activeDay || '0');
    if (active >= d.days.length) active = 0;
    tripPanelEl.dataset.activeDay = String(active);
    tabsHost.innerHTML = d.days.map((day, i) =>
      `<button class="day-tab ${i===active?'active':''}" data-i="${i}">Day ${i+1}<br><span style="opacity:.7">${fmtDate(day.date)}</span></button>`).join('');
    tabsHost.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', () => { tripPanelEl.dataset.activeDay = btn.dataset.i; renderDays(); });
    });
    const day = d.days[active];
    panelHost.innerHTML = `<div class="day-panel">
      <div class="day-date">${fmtDate(day.date)}</div>
      <div class="day-est" id="dayEst"></div>
      <label>Overnight in</label>
      <input class="overnight" id="dayOvernight" value="${esc(day.overnight)}" placeholder="e.g. Brussels">
      <label>Plan / notes</label>
      <textarea class="plan" id="dayPlan" placeholder="What's happening this day…">${esc(day.notes)}</textarea>
    </div>`;
    document.getElementById('dayOvernight').addEventListener('input', e => { day.overnight = e.target.value; scheduleSave(); refreshAuto(); renderWeather(); });
    document.getElementById('dayPlan').addEventListener('input', e => { day.notes = e.target.value; scheduleSave(); });
    renderDayOverview();
  }

  function renderBudget(){
    const d = state.draft;
    const cats = [['fuel','Fuel (extra)'],['ferry','Ferry / Tunnel (extra)'],['tolls','Tolls'],['accommodation','Accommodation'],['food','Food & drink'],['activities','Activities'],['misc','Misc']];
    const grid = document.getElementById('budgetGrid');
    grid.innerHTML = cats.map(([key,label]) => `
      <div class="budget-row">
        <label>${label}</label>
        <span class="amt">
          <select class="budgetCur" data-cat="${key}">${d.currencies.map(c => `<option value="${c}" ${c===(d.budgetCurrency[key]||d.currencies[0])?'selected':''}>${c}</option>`).join('')}</select>
          <input type="number" min="0" data-cat="${key}" value="${d.budget[key]||0}">
        </span>
      </div>`).join('');
    grid.querySelectorAll('input[data-cat]').forEach(inp => {
      inp.addEventListener('input', () => { d.budget[inp.dataset.cat] = parseFloat(inp.value)||0; scheduleSave(); renderTotals(); });
    });
    grid.querySelectorAll('select.budgetCur').forEach(sel => {
      sel.addEventListener('change', () => { d.budgetCurrency[sel.dataset.cat] = sel.value; scheduleSave(); renderTotals(); });
    });
    renderTotals();
  }

  function renderTotals(){
    const d = state.draft;
    const home = d.currencies[0];
    const sym = CURRENCY_SYM[home] || home;
    const bySpend = {};
    let missingRate = false;
    let legTotalHome = 0, legFuelHome = 0, legCrossHome = 0;
    (d.legs||[]).forEach(l => {
      const cur = l.costCurrency || home;
      const amt = parseFloat(l.cost)||0;
      if (l.mode === 'drive') legFuelHome += convertToHome(amt, cur, d);
      else if (l.mode === 'ferry' || l.mode === 'tunnel') legCrossHome += convertToHome(amt, cur, d);
      bySpend[cur] = (bySpend[cur]||0) + amt;
      if (cur !== home && (d.rates[cur]==null || d.rates[cur]<=0) && amt>0) missingRate = true;
      legTotalHome += convertToHome(amt, cur, d);
    });
    let budgetTotalHome = 0;
    Object.entries(d.budget||{}).forEach(([key,amt]) => {
      const cur = (d.budgetCurrency && d.budgetCurrency[key]) || home;
      const v = parseFloat(amt)||0;
      bySpend[cur] = (bySpend[cur]||0) + v;
      if (cur !== home && (d.rates[cur]==null || d.rates[cur]<=0) && v>0) missingRate = true;
      budgetTotalHome += convertToHome(v, cur, d);
    });
    const grand = legTotalHome + budgetTotalHome;
    const perPerson = grand / Math.max(1, d.travelers||1);
    const bar = document.getElementById('totalsBar');
    if (!bar) return;
    let breakdown = `<div style="width:100%;font-size:11.5px;color:var(--ink-faint);margin-top:6px;">Route costs: fuel ${sym}${legFuelHome.toFixed(0)} · ferry &amp; tunnel ${sym}${legCrossHome.toFixed(0)} · other legs ${sym}${Math.max(0, legTotalHome - legFuelHome - legCrossHome).toFixed(0)}</div>`;
    if (d.currencies.length > 1){
      const parts = Object.entries(bySpend).filter(([,v]) => v > 0).map(([c,v]) => `${CURRENCY_SYM[c]||c}${v.toFixed(0)}`);
      if (parts.length){
        breakdown += `<div style="width:100%;font-size:11.5px;color:var(--ink-faint);margin-top:4px;">Raw spend: ${parts.join(' + ')}${missingRate ? ' — set an exchange rate above for an accurate total' : ''}</div>`;
      }
    }
    bar.innerHTML = `
      <div class="tstat"><div class="label">Route costs</div><div class="val">${sym}${legTotalHome.toFixed(0)}</div></div>
      <div class="tstat"><div class="label">Other budget</div><div class="val">${sym}${budgetTotalHome.toFixed(0)}</div></div>
      <div class="tstat grand"><div class="label">Trip total (${home})</div><div class="val">${sym}${grand.toFixed(0)}</div></div>
      <div class="tstat"><div class="label">Per person</div><div class="val" style="font-size:20px">${sym}${perPerson.toFixed(0)}</div></div>
      ${breakdown}
    `;
  }

  document.getElementById('newTripBtn').addEventListener('click', async () => {
    const id = await Store.createTrip(blankTrip());
    selectTrip(id);
  });

  // ---------- boot ----------
  Store.init(onStoreChange).then(() => {
    if (Store.mode === 'firebase'){
      syncDot.classList.remove('offline');
      syncText.textContent = 'Synced live';
      footNote.textContent = 'Trips are stored in your Firebase project and sync live to anyone who opens this page.';
    } else {
      syncDot.classList.add('offline');
      syncText.textContent = 'Saved to this browser only';
      footNote.textContent = 'No live sync is configured, so trips are saved to this browser only. See README.md to add free Firebase sync so you and your mate can edit the same trips.';
    }
  });
})();
</script>
